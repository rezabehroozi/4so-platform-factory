name: mcp-external-interop-seal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-authority-notice:
    runs-on: ubuntu-latest
    steps:
      - name: C7W seal authority is local-only
        shell: bash
        run: |
          set -euo pipefail
          echo "This workflow is intentionally non-authoritative and cannot seal or persist C7W evidence."
          echo "Use: make c7w-status"
          echo "After all four real external clients are admitted, use: make c7w-seal"
          echo "Persist only the canonical progress/evidence files using the machine-actionable handoff returned by the local runner."
