name: mcp-external-interop-seal

on:
  workflow_dispatch:
    inputs:
      campaign_b64:
        description: Base64-encoded campaign.json from the prepared one-shot campaign
        required: true
        type: string
      chatgpt_receipt_b64:
        description: Base64-encoded independently produced ChatGPT receipt
        required: true
        type: string
      claude_receipt_b64:
        description: Base64-encoded independently produced Claude receipt
        required: true
        type: string
      gemini_receipt_b64:
        description: Base64-encoded independently produced Gemini receipt
        required: true
        type: string
      grok_receipt_b64:
        description: Base64-encoded independently produced Grok receipt
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-and-seal:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode independently produced campaign and receipts
        shell: bash
        env:
          CAMPAIGN_B64: ${{ inputs.campaign_b64 }}
          CHATGPT_B64: ${{ inputs.chatgpt_receipt_b64 }}
          CLAUDE_B64: ${{ inputs.claude_receipt_b64 }}
          GEMINI_B64: ${{ inputs.gemini_receipt_b64 }}
          GROK_B64: ${{ inputs.grok_receipt_b64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/mcp-interop/receipts
          printf '%s' "$CAMPAIGN_B64" | base64 -d > /tmp/mcp-interop/campaign.json
          printf '%s' "$CHATGPT_B64" | base64 -d > /tmp/mcp-interop/receipts/chatgpt.json
          printf '%s' "$CLAUDE_B64" | base64 -d > /tmp/mcp-interop/receipts/claude.json
          printf '%s' "$GEMINI_B64" | base64 -d > /tmp/mcp-interop/receipts/gemini.json
          printf '%s' "$GROK_B64" | base64 -d > /tmp/mcp-interop/receipts/grok.json
          test "$(find /tmp/mcp-interop/receipts -type f | wc -l)" = "4"
      - name: Verify replay fencing, negative controls and seal C7W evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/seal_mcp_external_interop.py \
            --campaign /tmp/mcp-interop/campaign.json \
            --receipts /tmp/mcp-interop/receipts \
            --out lab/mcp-external-client-interoperability-evidence.json
          jq -e '.authority=="MCP_EXTERNAL_CLIENT_INTEROPERABILITY_EVIDENCE_V1" and .certifiedClientCount==4 and .allRequiredChecksPass and .externalCertificationPass and (.runtimeCertified|not) and (.physicalCertified|not)' lab/mcp-external-client-interoperability-evidence.json
          python3 -m unittest tests.test_mcp_external_interop_seal
          python3 scripts/final_exact_release_admission.py --allow-pending --out /tmp/final-admission.json || test "$?" = "3"
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-external-client-interoperability-evidence
          path: lab/mcp-external-client-interoperability-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist exact external-client evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4so-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo "main advanced; refusing stale external-client evidence"; exit 2; }
          git add lab/mcp-external-client-interoperability-evidence.json
          git diff --cached --quiet && { echo "no C7W evidence delta"; exit 0; }
          git commit -m "evidence: seal external MCP interoperability"
          git push origin HEAD:main
