name: mcp-external-receipt-admission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-authority-notice:
    runs-on: ubuntu-latest
    steps:
      - name: C7W receipt admission authority is local-only
        shell: bash
        run: |
          set -euo pipefail
          echo "This workflow is intentionally non-authoritative and performs no receipt admission or Git persistence."
          echo "Use the canonical local runner status output and its nextClientHandoff."
          echo "Execute the exact packetPath, fill captureTemplatePath at expectedCapturePath under the private state directory, then execute the returned admitCommand."
          echo "Use --allow-campaign-supersede only for an explicitly superseded structurally valid incomplete campaign."
