name: mcp-external-receipt-admission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-authority-notice:
    runs-on: ubuntu-latest
    steps:
      - name: C7W receipt admission authority is local-only
        shell: bash
        run: |
          set -euo pipefail
          echo "This workflow is intentionally non-authoritative and performs no receipt admission or Git persistence."
          echo "Use the canonical local runner:"
          echo "  C7W_CLIENT=<chatgpt|claude|gemini|grok> C7W_CAPTURE=/secure/<client>.capture.json make c7w-admit"
          echo "Use C7W_ALLOW_CAMPAIGN_SUPERSEDE=true only for an explicitly superseded incomplete campaign."
