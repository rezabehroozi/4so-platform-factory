name: kyverno-runtime-realism

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kyverno-runtime-realism.yml
      - runtime/network-stack-kind-toolchain.json
      - catalog/runtime.go
      - catalog/runtime_normalization.go
      - catalog/runtime/kyverno/3.8.2/**
      - catalog/components/kyverno.json
      - catalog/component-runtime-certification.json
      - cmd/catalog-runtime-render/**

permissions:
  contents: write

jobs:
  runtime-matrix:
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.34.11", "1.35.8"]
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical runtime renderer
        run: go build -o /tmp/catalog-runtime-render ./cmd/catalog-runtime-render
      - name: Install exact kind
        shell: bash
        run: |
          set -euo pipefail
          url="$(jq -r '.spec.kind.url' runtime/network-stack-kind-toolchain.json)"
          expected="$(jq -r '.spec.kind.sha256' runtime/network-stack-kind-toolchain.json)"
          size="$(jq -r '.spec.kind.sizeBytes' runtime/network-stack-kind-toolchain.json)"
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/kind "$url"
          test "$(stat -c %s /tmp/kind)" = "$size"
          test "$(sha256sum /tmp/kind | awk '{print $1}')" = "$expected"
          chmod +x /tmp/kind
      - name: Create exact Kubernetes matrix member
        shell: bash
        run: |
          set -euo pipefail
          image="$(jq -r --arg v "${{ matrix.kubernetes }}" '.spec.kubernetes[] | select(.version==$v) | .nodeImage' runtime/network-stack-kind-toolchain.json)"
          test -n "$image" && test "$image" != null
          /tmp/kind create cluster --name 4so-kyverno --image "$image" --wait 5m
          test "$(kubectl version -o json | jq -r '.serverVersion.gitVersion')" = "v${{ matrix.kubernetes }}"
      - name: Render normalized Kyverno from canonical product code
        shell: bash
        run: |
          set -euo pipefail
          /tmp/catalog-runtime-render --component kyverno --namespace kyverno --release-id "runtime-${GITHUB_SHA}" --out /tmp/kyverno-list.json --evidence /tmp/kyverno-render-evidence.json
          jq -e '.name=="kyverno" and .version=="3.8.2" and .runtimeNormalization.authority=="KYVERNO_3_8_2_GITOPS_CRD_NORMALIZATION_V1" and .runtimeNormalization.applied and .runtimeNormalization.removedEmptyLabels==11 and .runtimeNormalization.removedEmptyAnnotations==11 and (.runtimeNormalization.resourceNames|length)==11 and .runtimeNormalization.serverSideApplyAnnotated>=13' /tmp/kyverno-render-evidence.json
      - name: Apply and prove convergent reconciliation
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace kyverno
          kubectl apply --server-side --force-conflicts --field-manager=argocd-controller -f /tmp/kyverno-list.json
          for crd in $(jq -r '.items[] | select(.kind=="CustomResourceDefinition") | .metadata.name' /tmp/kyverno-list.json); do
            kubectl wait --for=condition=Established "crd/$crd" --timeout=4m
          done
          kubectl -n kyverno wait --for=condition=Available deployment --all --timeout=10m
          kubectl -n kyverno wait --for=condition=Ready pod --all --timeout=10m
          set +e
          kubectl diff --server-side --field-manager=argocd-controller -f /tmp/kyverno-list.json >/tmp/kyverno-diff.txt
          diff_rc=$?
          set -e
          if test "$diff_rc" -ne 0; then
            echo "KYVERNO_RUNTIME_RECONCILIATION_DRIFT rc=$diff_rc"
            cat /tmp/kyverno-diff.txt
            exit 1
          fi
          : >/tmp/kyverno-second-apply.txt
      - name: Seal claim-scoped evidence
        shell: bash
        env:
          MATRIX_KUBERNETES: ${{ matrix.kubernetes }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          render=json.loads(Path("/tmp/kyverno-render-evidence.json").read_text())
          second=Path("/tmp/kyverno-second-apply.txt").read_text()
          receipt={
            "apiVersion":"platform.4so.io/v1alpha1","kind":"KyvernoRuntimeRealismEvidence",
            "authority":"KYVERNO_RUNTIME_REALISM_EVIDENCE_V1",
            "sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],
            "kubernetesVersion":os.environ["MATRIX_KUBERNETES"],"kyvernoRelease":"3.8.2",
            "renderedDigest":render["renderedDigest"],
            "normalizationAuthority":render["runtimeNormalization"]["authority"],
            "normalizedCRDCount":len(render["runtimeNormalization"]["resourceNames"]),
            "serverSideApplyCRDCount":render["runtimeNormalization"]["serverSideApplyAnnotated"],
            "secondApplyConverged":True,
            "controllersReady":True,"crdsEstablished":True,"runtimeRealismPass":True,
            "genericKubernetesRuntimeEvidenceOnly":True,"runtimeHoldReleased":False,
            "rke2Certified":False,"physicalCertified":False
          }
          Path("/tmp/kyverno-runtime.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          PY
          jq -e '.runtimeRealismPass and .secondApplyConverged and .normalizedCRDCount==11 and .serverSideApplyCRDCount>=13 and .genericKubernetesRuntimeEvidenceOnly and (.runtimeHoldReleased|not) and (.rke2Certified|not) and (.physicalCertified|not)' /tmp/kyverno-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: kyverno-runtime-${{ matrix.kubernetes }}
          path: /tmp/kyverno-runtime.json
          if-no-files-found: error
          retention-days: 30
      - name: Diagnostics
        if: failure()
        run: |
          set +e
          kubectl get nodes -o wide
          kubectl get crd | grep kyverno
          kubectl -n kyverno get all -o wide
          kubectl -n kyverno describe pods
      - name: Delete cluster
        if: always()
        run: /tmp/kind delete cluster --name 4so-kyverno || true

  aggregate-evidence:
    needs: runtime-matrix
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: kyverno-runtime-*
          path: /tmp/kyverno-evidence
      - name: Aggregate matrix without releasing hold
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[]
          for p in sorted(Path("/tmp/kyverno-evidence").rglob("kyverno-runtime.json")):
              row=json.loads(p.read_text())
              if row.get("authority")!="KYVERNO_RUNTIME_REALISM_EVIDENCE_V1" or row.get("sourceCommitSHA")!=os.environ["GITHUB_SHA"] or row.get("sourceRunId")!=os.environ["GITHUB_RUN_ID"]:
                  raise SystemExit("KYVERNO_MATRIX_SOURCE_MISMATCH")
              if row.get("runtimeRealismPass") is not True or row.get("secondApplyConverged") is not True or row.get("normalizedCRDCount")!=11:
                  raise SystemExit("KYVERNO_MATRIX_MEMBER_NOT_PASS")
              if any(row.get(k) is not False for k in ("runtimeHoldReleased","rke2Certified","physicalCertified")):
                  raise SystemExit("KYVERNO_MATRIX_SCOPE_INFLATION")
              rows.append(row)
          versions=sorted(r["kubernetesVersion"] for r in rows)
          if versions!=["1.34.11","1.35.8"]: raise SystemExit("KYVERNO_MATRIX_COVERAGE_INVALID")
          digests={r["renderedDigest"] for r in rows}
          if len(digests)!=1: raise SystemExit("KYVERNO_MATRIX_RENDER_DRIFT")
          out={
            "apiVersion":"platform.4so.io/v1alpha1","kind":"KyvernoRuntimeMatrixEvidence",
            "authority":"KYVERNO_RUNTIME_MATRIX_EVIDENCE_V1","sourceCommitSHA":os.environ["GITHUB_SHA"],
            "sourceRunId":os.environ["GITHUB_RUN_ID"],"kyvernoRelease":"3.8.2",
            "renderedDigest":next(iter(digests)),"kubernetesVersions":versions,
            "normalizationAuthority":"KYVERNO_3_8_2_GITOPS_CRD_NORMALIZATION_V1",
            "normalizedCRDCount":11,"matrixPass":True,"genericKubernetesRuntimeEvidenceOnly":True,
            "runtimeHoldReleased":False,"rke2Certified":False,"physicalCertified":False
          }
          Path("lab/kyverno-runtime-matrix-evidence.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          python3 scripts/validate_repository.py .
          git diff --check
      - name: Persist aggregate evidence when main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4so-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/kyverno-runtime-matrix-evidence.json
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo "main advanced; skip stale Kyverno evidence persistence"
            git reset -- lab/kyverno-runtime-matrix-evidence.json
            exit 0
          fi
          git commit -m "evidence: seal Kyverno runtime matrix"
          git push origin HEAD:main
