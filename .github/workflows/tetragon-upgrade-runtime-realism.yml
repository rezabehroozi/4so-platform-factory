name: tetragon-upgrade-runtime-realism

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tetragon-upgrade-runtime-realism.yml
      - catalog/runtime/tetragon/1.6.1/**
      - catalog/runtime/tetragon/1.7.0/**
      - catalog/component-runtime-upgrade-matrix.json
      - internal/runtimeupgrade/**

permissions:
  contents: write

jobs:
  upgrade-matrix:
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.34.11", "1.35.8"]
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Bind exact Tetragon upgrade profile
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .components[] | select(.component=="tetragon" and .targetRelease=="1.7.0" and .status=="admitted-source-pair")
            | .admittedEdges[] | select(.fromRelease=="1.6.1" and .toRelease=="1.7.0")
          ' catalog/component-runtime-upgrade-matrix.json >/tmp/edge.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected={("DaemonSet","platform-factory"),("Deployment","platform-factory-operator")}
          for version in ("1.6.1","1.7.0"):
              p=Path(f"catalog/runtime/tetragon/{version}/render-manifest.json")
              items=json.loads(p.read_text())
              if not isinstance(items,list) or not items:
                  raise SystemExit("TETRAGON_UPGRADE_RENDER_EMPTY")
              workloads=[]
              for obj in items:
                  kind=obj.get("kind")
                  name=(obj.get("metadata") or {}).get("name")
                  if kind in {"DaemonSet","Deployment","StatefulSet"}:
                      pod=(((obj.get("spec") or {}).get("template") or {}).get("spec") or {})
                      images=[c.get("image","") for c in [*(pod.get("initContainers") or []),*(pod.get("containers") or [])] if c.get("image")]
                      if not images or any("@sha256:" not in x for x in images):
                          raise SystemExit(f"TETRAGON_IMAGE_NOT_PINNED {version}:{kind}/{name}")
                      workloads.append((kind,name))
              if set(workloads)!=expected:
                  raise SystemExit(f"TETRAGON_WORKLOAD_IDENTITY_DRIFT {version}:{workloads}")
              Path(f"/tmp/tetragon-{version}.json").write_text(json.dumps({"apiVersion":"v1","kind":"List","items":items}))
          PY

      - name: Install exact kind runtime
        shell: bash
        run: |
          set -euo pipefail
          url="$(jq -r '.spec.kind.url' runtime/network-stack-kind-toolchain.json)"
          expected="$(jq -r '.spec.kind.sha256' runtime/network-stack-kind-toolchain.json)"
          size="$(jq -r '.spec.kind.sizeBytes' runtime/network-stack-kind-toolchain.json)"
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/kind "$url"
          test "$(stat -c %s /tmp/kind)" = "$size"
          test "$(sha256sum /tmp/kind|awk '{print $1}')" = "$expected"
          chmod +x /tmp/kind
          image="$(jq -r --arg v "${{ matrix.kubernetes }}" '.spec.kubernetes[]|select(.version==$v)|.nodeImage' runtime/network-stack-kind-toolchain.json)"
          case "$image" in kindest/node:v${{ matrix.kubernetes }}@sha256:*) ;; *) exit 21;; esac
          /tmp/kind create cluster --name 4so-tetragon-upgrade --image "$image"
          test "$(kubectl version -o json | jq -r .serverVersion.gitVersion)" = "v${{ matrix.kubernetes }}"

      - name: Install historical Tetragon and prove readiness
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace tetragon
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f /tmp/tetragon-1.6.1.json
          kubectl -n tetragon rollout status daemonset/platform-factory --timeout=12m
          kubectl -n tetragon rollout status deployment/platform-factory-operator --timeout=12m
          kubectl -n tetragon get daemonset/platform-factory deployment/platform-factory-operator -o json | jq -c '[.items[]|{kind:.kind,name:.metadata.name,uid:.metadata.uid}]|sort_by(.kind,.name)' >/tmp/tetragon-before-uids.json
          test "$(jq length /tmp/tetragon-before-uids.json)" = "2"

      - name: Upgrade Tetragon and prove exact convergence
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f /tmp/tetragon-1.7.0.json
          kubectl -n tetragon rollout status daemonset/platform-factory --timeout=12m
          kubectl -n tetragon rollout status deployment/platform-factory-operator --timeout=12m
          kubectl -n tetragon get daemonset/platform-factory deployment/platform-factory-operator -o json | jq -c '[.items[]|{kind:.kind,name:.metadata.name,uid:.metadata.uid}]|sort_by(.kind,.name)' >/tmp/tetragon-after-uids.json
          cmp /tmp/tetragon-before-uids.json /tmp/tetragon-after-uids.json
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          items=json.loads(Path("/tmp/tetragon-1.7.0.json").read_text())["items"]
          expected={}
          for obj in items:
              if obj.get("kind") not in {"DaemonSet","Deployment"}: continue
              pod=(((obj.get("spec") or {}).get("template") or {}).get("spec") or {})
              expected[(obj["kind"],obj["metadata"]["name"])]=[c["image"] for c in [*(pod.get("initContainers") or []),*(pod.get("containers") or [])] if c.get("image")]
          for (kind,name),images in expected.items():
              raw=subprocess.check_output(["kubectl","-n","tetragon","get",kind.lower(),name,"-o","json"],text=True)
              live=json.loads(raw); pod=live["spec"]["template"]["spec"]
              actual=[c["image"] for c in [*(pod.get("initContainers") or []),*(pod.get("containers") or [])] if c.get("image")]
              if actual!=images: raise SystemExit(f"TETRAGON_LIVE_IMAGE_DRIFT {kind}/{name}:{actual}!={images}")
          PY
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f /tmp/tetragon-1.7.0.json >/tmp/tetragon-reapply.txt
          kubectl -n tetragon rollout status daemonset/platform-factory --timeout=4m
          kubectl -n tetragon rollout status deployment/platform-factory-operator --timeout=4m

      - name: Prove reverse edge is rejected
        run: go test ./internal/runtimeupgrade -run 'TestUpgradeRejectsReverseOrNonCanonicalVersionEdges|TestUpgradeRequiresExactDistinctSourcePair'

      - name: Seal Tetragon upgrade evidence
        shell: bash
        env:
          MATRIX_KUBERNETES: "${{ matrix.kubernetes }}"
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def h(p): return "sha256:"+hashlib.sha256(Path(p).read_bytes()).hexdigest()
          v=os.environ["MATRIX_KUBERNETES"]
          out={"apiVersion":"platform.4so.io/v1alpha1","kind":"TetragonUpgradeRuntimeEvidence","authority":"TETRAGON_RUNTIME_UPGRADE_EVIDENCE_V1","sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],"kubernetesVersion":v,"fromRelease":"1.6.1","toRelease":"1.7.0","fromRenderSha256":h("catalog/runtime/tetragon/1.6.1/render-manifest.json"),"toRenderSha256":h("catalog/runtime/tetragon/1.7.0/render-manifest.json"),"workloadIdentities":["DaemonSet/platform-factory","Deployment/platform-factory-operator"],"historicalReady":True,"upgradeApplyPass":True,"targetReady":True,"workloadIdentityPreserved":True,"targetImagesVerified":True,"targetReapplyConverged":True,"reverseEdgeRejected":True,"genericKubernetesRuntimeEvidenceOnly":True,"rke2Certified":False,"productTopologyHACertified":False,"physicalCertified":False}
          Path(f"/tmp/tetragon-upgrade-{v}.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tetragon-upgrade-${{ matrix.kubernetes }}
          path: /tmp/tetragon-upgrade-${{ matrix.kubernetes }}.json
          retention-days: 30

      - if: always()
        run: /tmp/kind delete cluster --name 4so-tetragon-upgrade || true

  aggregate:
    needs: upgrade-matrix
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: tetragon-upgrade-*
          path: /tmp/tetragon-upgrade
          merge-multiple: true
      - name: Aggregate exact Tetragon upgrade matrix
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in sorted(Path("/tmp/tetragon-upgrade").glob("tetragon-upgrade-*.json"))]
          if {r["kubernetesVersion"] for r in rows}!={"1.34.11","1.35.8"}: raise SystemExit("TETRAGON_UPGRADE_MATRIX_COVERAGE_INVALID")
          req=("historicalReady","upgradeApplyPass","targetReady","workloadIdentityPreserved","targetImagesVerified","targetReapplyConverged","reverseEdgeRejected")
          if any((r["fromRelease"],r["toRelease"])!=("1.6.1","1.7.0") or not all(r.get(k) is True for k in req) for r in rows): raise SystemExit("TETRAGON_UPGRADE_MATRIX_INVALID")
          out={"apiVersion":"platform.4so.io/v1alpha1","kind":"TetragonUpgradeRuntimeMatrixEvidence","authority":"TETRAGON_RUNTIME_UPGRADE_MATRIX_V1","sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],"fromRelease":"1.6.1","toRelease":"1.7.0","matrix":rows,"matrixPass":True,"genericKubernetesRuntimeEvidenceOnly":True,"rke2Certified":False,"productTopologyHACertified":False,"physicalCertified":False}
          Path("lab/tetragon-upgrade-runtime-matrix-evidence.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tetragon-upgrade-runtime-matrix
          path: lab/tetragon-upgrade-runtime-matrix-evidence.json
          retention-days: 30
      - name: Persist evidence when main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4so-evidence-bot"; git config user.email "actions@users.noreply.github.com"
          git add lab/tetragon-upgrade-runtime-matrix-evidence.json
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then echo "main advanced; skip stale Tetragon upgrade evidence"; git reset -- lab/tetragon-upgrade-runtime-matrix-evidence.json; exit 0; fi
          git commit -m "evidence: seal Tetragon runtime upgrade matrix"
          git push origin HEAD:main
