name: rke2-kyverno-runtime-certification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/rke2-kyverno-runtime-certification.yml
      - lab/appliance-bundle-acquisition-lock.json
      - catalog/runtime.go
      - catalog/runtime_normalization.go
      - catalog/runtime/kyverno/3.8.2/**
      - catalog/components/kyverno.json
permissions:
  contents: write
jobs:
  exact-rke2-kyverno:
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact RKE2 authority
        shell: bash
        run: |
          set -euo pipefail
          row="$(jq -c '.resolvedAuthorities[] | select(.id=="rke2-installer-and-offline-artifacts")' lab/appliance-bundle-acquisition-lock.json)"
          echo "RKE2_VERSION=$(jq -r .version <<<"$row")" >> "$GITHUB_ENV"
          echo "INSTALL_URL=$(jq -r '.artifacts[]|select(.name=="install.sh")|.urls[0]' <<<"$row")" >> "$GITHUB_ENV"
          echo "INSTALL_SHA=$(jq -r '.artifacts[]|select(.name=="install.sh")|.sha256' <<<"$row")" >> "$GITHUB_ENV"
          echo "TAR_URL=$(jq -r '.artifacts[]|select(.name=="rke2.linux-amd64.tar.gz")|.urls[0]' <<<"$row")" >> "$GITHUB_ENV"
          echo "TAR_SHA=$(jq -r '.artifacts[]|select(.name=="rke2.linux-amd64.tar.gz")|.sha256' <<<"$row")" >> "$GITHUB_ENV"
          echo "IMAGES_URL=$(jq -r '.artifacts[]|select(.name=="rke2-images.linux-amd64.tar.zst")|.urls[0]' <<<"$row")" >> "$GITHUB_ENV"
          echo "IMAGES_SHA=$(jq -r '.artifacts[]|select(.name=="rke2-images.linux-amd64.tar.zst")|.sha256' <<<"$row")" >> "$GITHUB_ENV"
          echo "SUMS_URL=$(jq -r '.artifacts[]|select(.name=="sha256sum-amd64.txt")|.urls[0]' <<<"$row")" >> "$GITHUB_ENV"
          echo "SUMS_SHA=$(jq -r '.artifacts[]|select(.name=="sha256sum-amd64.txt")|.sha256' <<<"$row")" >> "$GITHUB_ENV"
      - name: Download exact RKE2 bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/install.sh "$INSTALL_URL"
          curl -fL --retry 3 -o /tmp/rke2.linux-amd64.tar.gz "$TAR_URL"
          curl -fL --retry 3 -o /tmp/rke2-images.linux-amd64.tar.zst "$IMAGES_URL"
          curl -fL --retry 3 -o /tmp/sha256sum-amd64.txt "$SUMS_URL"
          test "$(sha256sum /tmp/install.sh|awk '{print $1}')" = "$INSTALL_SHA"
          test "$(sha256sum /tmp/rke2.linux-amd64.tar.gz|awk '{print $1}')" = "$TAR_SHA"
          test "$(sha256sum /tmp/rke2-images.linux-amd64.tar.zst|awk '{print $1}')" = "$IMAGES_SHA"
          test "$(sha256sum /tmp/sha256sum-amd64.txt|awk '{print $1}')" = "$SUMS_SHA"
          grep -F "$TAR_SHA  rke2.linux-amd64.tar.gz" /tmp/sha256sum-amd64.txt
          grep -F "$IMAGES_SHA  rke2-images.linux-amd64.tar.zst" /tmp/sha256sum-amd64.txt
      - name: Install exact RKE2 runtime
        shell: bash
        run: |
          set -euo pipefail
          chmod +x /tmp/install.sh
          sudo mkdir -p /var/lib/rancher/rke2/agent/images /etc/rancher/rke2
          sudo cp /tmp/rke2-images.linux-amd64.tar.zst /var/lib/rancher/rke2/agent/images/
          sudo env INSTALL_RKE2_ARTIFACT_PATH=/tmp INSTALL_RKE2_VERSION="$RKE2_VERSION" INSTALL_RKE2_SKIP_DOWNLOAD=true /tmp/install.sh
          sudo tee /etc/rancher/rke2/config.yaml >/dev/null <<'YAML'
          disable:
            - rke2-ingress-nginx
          write-kubeconfig-mode: "0644"
          YAML
          sudo systemctl enable --now rke2-server
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          for i in $(seq 1 90); do /var/lib/rancher/rke2/bin/kubectl get node >/dev/null 2>&1 && break; sleep 5; done
          /var/lib/rancher/rke2/bin/kubectl wait --for=condition=Ready nodes --all --timeout=10m
          /usr/local/bin/rke2 --version | grep -F "v1.34.10+rke2r1"
      - name: Build canonical Kyverno renderer
        run: go build -o /tmp/catalog-runtime-render ./cmd/catalog-runtime-render
      - name: Apply normalized Kyverno and prove convergence
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          K=/var/lib/rancher/rke2/bin/kubectl
          /tmp/catalog-runtime-render --component kyverno --namespace kyverno --release-id "rke2-$GITHUB_SHA" --out /tmp/kyverno-list.json --evidence /tmp/kyverno-render-evidence.json
          jq -e '.runtimeNormalization.authority=="KYVERNO_3_8_2_GITOPS_CRD_NORMALIZATION_V1" and .runtimeNormalization.applied and .runtimeNormalization.removedEmptyLabels==11 and .runtimeNormalization.removedEmptyAnnotations==11' /tmp/kyverno-render-evidence.json
          $K create namespace kyverno
          $K apply --server-side --force-conflicts --field-manager=argocd-controller -f /tmp/kyverno-list.json
          for crd in $(jq -r '.items[]|select(.kind=="CustomResourceDefinition")|.metadata.name' /tmp/kyverno-list.json); do $K wait --for=condition=Established "crd/$crd" --timeout=4m; done
          $K -n kyverno wait --for=condition=Available deployment --all --timeout=12m
          if $K -n kyverno get job -o name | grep -q .; then $K -n kyverno wait --for=condition=Complete job --all --timeout=12m; fi
          $K diff --server-side --field-manager=argocd-controller -f /tmp/kyverno-list.json >/tmp/kyverno-rke2-diff.txt
      - name: Seal RKE2 Kyverno evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          render=Path("/tmp/kyverno-list.json").read_bytes()
          out={"apiVersion":"platform.4so.io/v1alpha1","kind":"RKE2KyvernoRuntimeEvidence","authority":"RKE2_KYVERNO_RUNTIME_CERTIFICATION_V1","sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],"rke2Version":os.environ["RKE2_VERSION"],"kyvernoRelease":"3.8.2","renderedDigest":"sha256:"+hashlib.sha256(render).hexdigest(),"normalizationAuthority":"KYVERNO_3_8_2_GITOPS_CRD_NORMALIZATION_V1","normalizedCRDCount":11,"rke2Certified":True,"secondApplyConverged":True,"runtimeHoldReleaseEligible":True,"productTopologyHACertified":False,"physicalCertified":False}
          Path("lab/rke2-kyverno-runtime-evidence.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          jq -e '.rke2Certified and .secondApplyConverged and .runtimeHoldReleaseEligible and (.productTopologyHACertified|not) and (.physicalCertified|not)' lab/rke2-kyverno-runtime-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: rke2-kyverno-runtime-certification
          path: lab/rke2-kyverno-runtime-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist exact evidence when main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4so-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/rke2-kyverno-runtime-evidence.json
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then echo "main advanced; skip stale RKE2 Kyverno evidence persistence"; git reset -- lab/rke2-kyverno-runtime-evidence.json; exit 0; fi
          git commit -m "evidence: seal RKE2 Kyverno runtime"
          git push origin HEAD:main
      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          sudo journalctl -u rke2-server --no-pager -n 200 || true
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          test -x /var/lib/rancher/rke2/bin/kubectl && /var/lib/rancher/rke2/bin/kubectl get pods -A -o wide || true
