name: ceph-csi-driver-image-set-authority
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ceph-csi-driver-image-set-authority.yml
      - catalog/runtime-dependencies/ceph-csi/1.0.4/driver-image-set-input.json
      - scripts/ceph_csi_driver_image_set.py
      - tests/test_ceph_csi_driver_image_set.py
permissions:
  contents: write
jobs:
  resolve-exact-images:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve upstream defaults to immutable digests
        run: |
          set -euo pipefail
          python3 scripts/ceph_csi_driver_image_set.py --resolve
          python3 scripts/ceph_csi_driver_image_set.py --verify
          python3 -m unittest tests.test_ceph_csi_driver_image_set
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: ceph-csi-driver-image-set
          path: lab/ceph-csi-driver-image-set-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist exact image authority when main is unchanged
        run: |
          set -euo pipefail
          git config user.name 4so-evidence-bot
          git config user.email actions@users.noreply.github.com
          git add lab/ceph-csi-driver-image-set-evidence.json
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo "main advanced; skip stale Ceph CSI image evidence persistence"
            git reset -- lab/ceph-csi-driver-image-set-evidence.json
            exit 0
          fi
          git commit -m "evidence: seal Ceph CSI driver image set"
          git push origin HEAD:main
