name: cert-manager-upgrade-runtime-realism

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cert-manager-upgrade-runtime-realism.yml
      - catalog/runtime/cert-manager/1.21.0/**
      - catalog/runtime/cert-manager/1.21.1/**
      - catalog/runtime-dependencies/cert-manager/**
      - lab/cert-manager-crd-runtime-dependency-evidence.json
      - catalog/component-runtime-upgrade-matrix.json
      - internal/runtimeupgrade/**

permissions:
  contents: write

jobs:
  upgrade-matrix:
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.34.11", "1.35.8"]
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Bind exact cert-manager runtime authorities
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_cert_manager_crd_dependency.py --require-bytes
          jq -e '
            .authority=="CERT_MANAGER_CRD_RUNTIME_DEPENDENCY_EVIDENCE_V1"
            and .bytesVerified
            and .expectedCRDCount==6
            and (.runtimeCertified|not)
            and (.physicalCertified|not)
          ' lab/cert-manager-crd-runtime-dependency-evidence.json
          jq -e '
            .components[] | select(.component=="cert-manager" and .targetRelease=="1.21.1" and .status=="admitted-source-pair")
            | .admittedEdges[] | select(.fromRelease=="1.21.0" and .toRelease=="1.21.1")
          ' catalog/component-runtime-upgrade-matrix.json >/tmp/edge.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_deployments={
            "platform-factory-cert-manager",
            "platform-factory-cert-manager-cainjector",
            "platform-factory-cert-manager-webhook",
          }
          for version in ("1.21.0","1.21.1"):
              items=json.loads(Path(f"catalog/runtime/cert-manager/{version}/render-manifest.json").read_text())
              if not isinstance(items,list) or not items:
                  raise SystemExit("CERT_MANAGER_UPGRADE_RENDER_EMPTY")
              deployments=[x for x in items if x.get("kind")=="Deployment"]
              if {x["metadata"]["name"] for x in deployments}!=expected_deployments:
                  raise SystemExit(f"CERT_MANAGER_DEPLOYMENT_SET_DRIFT {version}")
              jobs=[x for x in items if x.get("kind")=="Job"]
              if len(jobs)!=1 or jobs[0]["metadata"]["name"]!="platform-factory-cert-manager-startupapicheck":
                  raise SystemExit(f"CERT_MANAGER_JOB_IDENTITY_DRIFT {version}")
              hooks={(x.get("kind"),(x.get("metadata") or {}).get("name")) for x in items if x.get("kind") in {"MutatingWebhookConfiguration","ValidatingWebhookConfiguration"}}
              expected_hooks={
                ("MutatingWebhookConfiguration","platform-factory-cert-manager-webhook"),
                ("ValidatingWebhookConfiguration","platform-factory-cert-manager-webhook"),
              }
              if hooks!=expected_hooks:
                  raise SystemExit(f"CERT_MANAGER_WEBHOOK_IDENTITY_DRIFT {version}")
              images=[]
              for obj in [*deployments,*jobs]:
                  pod=(((obj.get("spec") or {}).get("template") or {}).get("spec") or {})
                  images.extend(c.get("image","") for c in [*(pod.get("initContainers") or []),*(pod.get("containers") or [])] if c.get("image"))
              if not images or any("@sha256:" not in image for image in images):
                  raise SystemExit(f"CERT_MANAGER_IMAGE_NOT_DIGEST_PINNED {version}")
              Path(f"/tmp/cert-manager-{version}.json").write_text(json.dumps({"apiVersion":"v1","kind":"List","items":items}))
          PY

      - name: Install exact kind runtime
        shell: bash
        run: |
          set -euo pipefail
          url="$(jq -r '.spec.kind.url' runtime/network-stack-kind-toolchain.json)"
          expected="$(jq -r '.spec.kind.sha256' runtime/network-stack-kind-toolchain.json)"
          size="$(jq -r '.spec.kind.sizeBytes' runtime/network-stack-kind-toolchain.json)"
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/kind "$url"
          test "$(stat -c %s /tmp/kind)" = "$size"
          test "$(sha256sum /tmp/kind|awk '{print $1}')" = "$expected"
          chmod +x /tmp/kind
          image="$(jq -r --arg v "${{ matrix.kubernetes }}" '.spec.kubernetes[]|select(.version==$v)|.nodeImage' runtime/network-stack-kind-toolchain.json)"
          case "$image" in kindest/node:v${{ matrix.kubernetes }}@sha256:*) ;; *) exit 21;; esac
          /tmp/kind create cluster --name 4so-cert-manager-upgrade --image "$image"
          test "$(kubectl version -o json | jq -r .serverVersion.gitVersion)" = "v${{ matrix.kubernetes }}"

      - name: Install historical cert-manager with exact CRDs
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply --server-side --force-conflicts --field-manager=4so-cert-manager-crd -f catalog/runtime-dependencies/cert-manager/1.21.0/cert-manager.crds.yaml
          for crd in certificates.cert-manager.io certificaterequests.cert-manager.io issuers.cert-manager.io clusterissuers.cert-manager.io orders.acme.cert-manager.io challenges.acme.cert-manager.io; do
            kubectl wait --for=condition=Established "crd/$crd" --timeout=4m
          done
          kubectl create namespace cert-manager
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f /tmp/cert-manager-1.21.0.json
          kubectl -n cert-manager wait --for=condition=Available deployment --all --timeout=12m
          kubectl -n cert-manager wait --for=condition=Complete job/platform-factory-cert-manager-startupapicheck --timeout=12m
          kubectl -n cert-manager get deployment -o json | jq -c '[.items[]|{name:.metadata.name,uid:.metadata.uid}]|sort_by(.name)' >/tmp/cm-before-deployments.json
          kubectl get mutatingwebhookconfiguration/platform-factory-cert-manager-webhook validatingwebhookconfiguration/platform-factory-cert-manager-webhook -o json | jq -c '[.items[]|{kind:.kind,name:.metadata.name,uid:.metadata.uid}]|sort_by(.kind)' >/tmp/cm-before-webhooks.json
          kubectl get crd certificates.cert-manager.io certificaterequests.cert-manager.io issuers.cert-manager.io clusterissuers.cert-manager.io orders.acme.cert-manager.io challenges.acme.cert-manager.io -o json | jq -c '[.items[]|{name:.metadata.name,uid:.metadata.uid,storedVersions:.status.storedVersions}]|sort_by(.name)' >/tmp/cm-before-crds.json
          test "$(jq length /tmp/cm-before-deployments.json)" = "3"
          test "$(jq length /tmp/cm-before-webhooks.json)" = "2"
          test "$(jq length /tmp/cm-before-crds.json)" = "6"

      - name: Upgrade cert-manager and prove CRD and webhook continuity
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply --server-side --force-conflicts --field-manager=4so-cert-manager-crd -f catalog/runtime-dependencies/cert-manager/1.21.1/cert-manager.crds.yaml
          for crd in certificates.cert-manager.io certificaterequests.cert-manager.io issuers.cert-manager.io clusterissuers.cert-manager.io orders.acme.cert-manager.io challenges.acme.cert-manager.io; do
            kubectl wait --for=condition=Established "crd/$crd" --timeout=4m
            kubectl get "crd/$crd" -o json | jq -e '[.status.storedVersions[] as $s | .spec.versions[] | select(.name==$s)] | length > 0' >/dev/null
          done
          kubectl -n cert-manager delete job/platform-factory-cert-manager-startupapicheck --ignore-not-found --wait=true
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f /tmp/cert-manager-1.21.1.json
          kubectl -n cert-manager wait --for=condition=Available deployment --all --timeout=12m
          kubectl -n cert-manager wait --for=condition=Complete job/platform-factory-cert-manager-startupapicheck --timeout=12m
          kubectl -n cert-manager get deployment -o json | jq -c '[.items[]|{name:.metadata.name,uid:.metadata.uid}]|sort_by(.name)' >/tmp/cm-after-deployments.json
          kubectl get mutatingwebhookconfiguration/platform-factory-cert-manager-webhook validatingwebhookconfiguration/platform-factory-cert-manager-webhook -o json | jq -c '[.items[]|{kind:.kind,name:.metadata.name,uid:.metadata.uid}]|sort_by(.kind)' >/tmp/cm-after-webhooks.json
          kubectl get crd certificates.cert-manager.io certificaterequests.cert-manager.io issuers.cert-manager.io clusterissuers.cert-manager.io orders.acme.cert-manager.io challenges.acme.cert-manager.io -o json | jq -c '[.items[]|{name:.metadata.name,uid:.metadata.uid,storedVersions:.status.storedVersions}]|sort_by(.name)' >/tmp/cm-after-crds.json
          cmp /tmp/cm-before-deployments.json /tmp/cm-after-deployments.json
          cmp /tmp/cm-before-webhooks.json /tmp/cm-after-webhooks.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          before={x["name"]:x for x in json.loads(Path("/tmp/cm-before-crds.json").read_text())}
          after={x["name"]:x for x in json.loads(Path("/tmp/cm-after-crds.json").read_text())}
          if set(before)!=set(after):
              raise SystemExit("CERT_MANAGER_CRD_SET_DRIFT")
          for name in before:
              if before[name]["uid"]!=after[name]["uid"]:
                  raise SystemExit(f"CERT_MANAGER_CRD_UID_DRIFT {name}")
              if not after[name]["storedVersions"]:
                  raise SystemExit(f"CERT_MANAGER_CRD_STORED_VERSION_EMPTY {name}")
          PY
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          items=json.loads(Path("/tmp/cert-manager-1.21.1.json").read_text())["items"]
          for obj in items:
              if obj.get("kind")!="Deployment": continue
              name=obj["metadata"]["name"]; pod=obj["spec"]["template"]["spec"]
              expected=[c["image"] for c in [*(pod.get("initContainers") or []),*(pod.get("containers") or [])] if c.get("image")]
              live=json.loads(subprocess.check_output(["kubectl","-n","cert-manager","get","deployment",name,"-o","json"],text=True))
              lp=live["spec"]["template"]["spec"]
              actual=[c["image"] for c in [*(lp.get("initContainers") or []),*(lp.get("containers") or [])] if c.get("image")]
              if actual!=expected:
                  raise SystemExit(f"CERT_MANAGER_LIVE_IMAGE_DRIFT {name}:{actual}!={expected}")
          PY
          kubectl apply --server-side --force-conflicts --field-manager=4so-cert-manager-crd -f catalog/runtime-dependencies/cert-manager/1.21.1/cert-manager.crds.yaml >/tmp/cm-crd-reapply.txt
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f /tmp/cert-manager-1.21.1.json >/tmp/cm-reapply.txt
          kubectl -n cert-manager wait --for=condition=Available deployment --all --timeout=4m

      - name: Prove reverse edge is rejected
        run: go test ./internal/runtimeupgrade -run 'TestUpgradeRejectsReverseOrNonCanonicalVersionEdges|TestUpgradeRequiresExactDistinctSourcePair'

      - name: Seal cert-manager upgrade evidence
        shell: bash
        env:
          MATRIX_KUBERNETES: "${{ matrix.kubernetes }}"
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def h(p): return "sha256:"+hashlib.sha256(Path(p).read_bytes()).hexdigest()
          v=os.environ["MATRIX_KUBERNETES"]
          out={"apiVersion":"platform.4so.io/v1alpha1","kind":"CertManagerUpgradeRuntimeEvidence","authority":"CERT_MANAGER_RUNTIME_UPGRADE_EVIDENCE_V1","sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],"kubernetesVersion":v,"fromRelease":"1.21.0","toRelease":"1.21.1","fromRenderSha256":h("catalog/runtime/cert-manager/1.21.0/render-manifest.json"),"toRenderSha256":h("catalog/runtime/cert-manager/1.21.1/render-manifest.json"),"fromCRDSha256":h("catalog/runtime-dependencies/cert-manager/1.21.0/cert-manager.crds.yaml"),"toCRDSha256":h("catalog/runtime-dependencies/cert-manager/1.21.1/cert-manager.crds.yaml"),"crdDependencyAuthority":"CERT_MANAGER_CRD_RUNTIME_DEPENDENCY_EVIDENCE_V1","historicalReady":True,"upgradeApplyPass":True,"targetReady":True,"deploymentIdentityPreserved":True,"webhookIdentityPreserved":True,"crdIdentityPreserved":True,"storedVersionsValid":True,"startupJobReplaced":True,"targetImagesVerified":True,"targetReapplyConverged":True,"reverseEdgeRejected":True,"genericKubernetesRuntimeEvidenceOnly":True,"rke2Certified":False,"productTopologyHACertified":False,"physicalCertified":False}
          Path(f"/tmp/cert-manager-upgrade-{v}.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: cert-manager-upgrade-${{ matrix.kubernetes }}
          path: /tmp/cert-manager-upgrade-${{ matrix.kubernetes }}.json
          retention-days: 30

      - if: always()
        run: /tmp/kind delete cluster --name 4so-cert-manager-upgrade || true

  aggregate:
    needs: upgrade-matrix
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: cert-manager-upgrade-*
          path: /tmp/cert-manager-upgrade
          merge-multiple: true
      - name: Aggregate exact cert-manager upgrade matrix
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in sorted(Path("/tmp/cert-manager-upgrade").glob("cert-manager-upgrade-*.json"))]
          if {r["kubernetesVersion"] for r in rows}!={"1.34.11","1.35.8"}: raise SystemExit("CERT_MANAGER_UPGRADE_MATRIX_COVERAGE_INVALID")
          req=("historicalReady","upgradeApplyPass","targetReady","deploymentIdentityPreserved","webhookIdentityPreserved","crdIdentityPreserved","storedVersionsValid","startupJobReplaced","targetImagesVerified","targetReapplyConverged","reverseEdgeRejected")
          if any((r["fromRelease"],r["toRelease"])!=("1.21.0","1.21.1") or r.get("crdDependencyAuthority")!="CERT_MANAGER_CRD_RUNTIME_DEPENDENCY_EVIDENCE_V1" or not all(r.get(k) is True for k in req) for r in rows): raise SystemExit("CERT_MANAGER_UPGRADE_MATRIX_INVALID")
          out={"apiVersion":"platform.4so.io/v1alpha1","kind":"CertManagerUpgradeRuntimeMatrixEvidence","authority":"CERT_MANAGER_RUNTIME_UPGRADE_MATRIX_V1","sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],"fromRelease":"1.21.0","toRelease":"1.21.1","crdDependencyAuthority":"CERT_MANAGER_CRD_RUNTIME_DEPENDENCY_EVIDENCE_V1","matrix":rows,"matrixPass":True,"genericKubernetesRuntimeEvidenceOnly":True,"rke2Certified":False,"productTopologyHACertified":False,"physicalCertified":False}
          Path("lab/cert-manager-upgrade-runtime-matrix-evidence.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cert-manager-upgrade-runtime-matrix
          path: lab/cert-manager-upgrade-runtime-matrix-evidence.json
          retention-days: 30
      - name: Persist evidence when main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4so-evidence-bot"; git config user.email "actions@users.noreply.github.com"
          git add lab/cert-manager-upgrade-runtime-matrix-evidence.json
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then echo "main advanced; skip stale cert-manager upgrade evidence"; git reset -- lab/cert-manager-upgrade-runtime-matrix-evidence.json; exit 0; fi
          git commit -m "evidence: seal cert-manager runtime upgrade matrix"
          git push origin HEAD:main
