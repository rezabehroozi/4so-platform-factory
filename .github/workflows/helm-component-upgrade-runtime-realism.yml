name: helm-component-upgrade-runtime-realism

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/helm-component-upgrade-runtime-realism.yml
      - scripts/render_exact_helm_runtime.py
      - catalog/runtime/capsule/0.13.10/**
      - catalog/runtime/capsule/0.13.11/**
      - catalog/runtime/victoria-metrics/0.90.1/**
      - catalog/runtime/victoria-metrics/0.90.2/**
      - catalog/component-runtime-upgrade-matrix.json
      - internal/runtimeupgrade/**

permissions:
  contents: write

jobs:
  upgrade-matrix:
    strategy:
      fail-fast: false
      matrix:
        component: [capsule, victoria-metrics]
        kubernetes: ["1.34.11", "1.35.8"]
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Bind exact source pair and render authority
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          RUNTIME_KUBERNETES: ${{ matrix.kubernetes }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            capsule) from=0.13.10; to=0.13.11 ;;
            victoria-metrics) from=0.90.1; to=0.90.2 ;;
            *) echo "UNSUPPORTED_HELM_UPGRADE_PROFILE $COMPONENT" >&2; exit 20 ;;
          esac
          case "$RUNTIME_KUBERNETES" in
            1.34.11) render_kube=1.34.0 ;;
            1.35.8) render_kube=1.35.0 ;;
            *) echo "UNSUPPORTED_RUNTIME_KUBERNETES $RUNTIME_KUBERNETES" >&2; exit 21 ;;
          esac
          ns_from="$(jq -r .generation.namespace "catalog/runtime/$COMPONENT/$from/source-lock.json")"
          ns_to="$(jq -r .generation.namespace "catalog/runtime/$COMPONENT/$to/source-lock.json")"
          test -n "$ns_from" && test "$ns_from" != null && test "$ns_from" = "$ns_to"
          printf '%s\n' "FROM_RELEASE=$from" "TO_RELEASE=$to" "RENDER_KUBERNETES=$render_kube" "NAMESPACE=$ns_from" >> "$GITHUB_ENV"
          jq -e --arg c "$COMPONENT" --arg f "$from" --arg t "$to" '
            .components[] | select(.component==$c and .targetRelease==$t and .status=="admitted-source-pair")
            | .admittedEdges[] | select(.fromRelease==$f and .toRelease==$t)
          ' catalog/component-runtime-upgrade-matrix.json >/tmp/edge.json
          for version in "$from" "$to"; do
            jq -e --arg k "$render_kube" '
              .sourceType=="helm-chart" and .networkFetchRequired==false and
              (.generation.kubernetesRenderDigests[$k] | type=="string" and startswith("sha256:"))
            ' "catalog/runtime/$COMPONENT/$version/source-lock.json" >/dev/null
          done

      - name: Render exact historical and target runtime lists
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          for version in "$FROM_RELEASE" "$TO_RELEASE"; do
            python3 scripts/render_exact_helm_runtime.py               --component "$COMPONENT"               --release "$version"               --kube-version "$RENDER_KUBERNETES"               --out "/tmp/$COMPONENT-$version.json"               --evidence "/tmp/$COMPONENT-$version-render-evidence.json"
            jq -e --arg c "$COMPONENT" --arg v "$version" --arg k "$RENDER_KUBERNETES" '
              .authority=="EXACT_HELM_RUNTIME_RENDER_V1" and .component==$c and .release==$v and
              .kubernetesVersion==$k and .networkSourceFetchRequired==false and
              (.images|length)>0 and all(.images[]; contains("@sha256:"))
            ' "/tmp/$COMPONENT-$version-render-evidence.json" >/dev/null
          done
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          c=os.environ["COMPONENT"]
          for version in (os.environ["FROM_RELEASE"],os.environ["TO_RELEASE"]):
              p=Path(f"/tmp/{c}-{version}.json")
              doc=json.loads(p.read_text())
              items=doc.get("items") or []
              if not items:
                  raise SystemExit(f"HELM_UPGRADE_RENDER_EMPTY {c}:{version}")
              crds=[x for x in items if x.get("kind")=="CustomResourceDefinition"]
              resources=[x for x in items if x.get("kind")!="CustomResourceDefinition"]
              workloads=[]
              for obj in resources:
                  kind=obj.get("kind")
                  if kind not in {"Deployment","DaemonSet","StatefulSet"}:
                      continue
                  meta=obj.get("metadata") or {}
                  pod=((obj.get("spec") or {}).get("template") or {}).get("spec") or {}
                  images=[x.get("image","") for x in [*(pod.get("initContainers") or []),*(pod.get("containers") or [])] if x.get("image")]
                  if not images or any("@sha256:" not in image for image in images):
                      raise SystemExit(f"HELM_UPGRADE_WORKLOAD_IMAGE_NOT_PINNED {c}:{version}:{kind}/{meta.get('name')}")
                  workloads.append({"kind":kind,"name":meta.get("name"),"namespace":meta.get("namespace") or os.environ["NAMESPACE"],"images":images})
              if not workloads:
                  raise SystemExit(f"HELM_UPGRADE_WORKLOADS_EMPTY {c}:{version}")
              Path(f"/tmp/{c}-{version}-crds.json").write_text(json.dumps({"apiVersion":"v1","kind":"List","items":crds}))
              Path(f"/tmp/{c}-{version}-resources.json").write_text(json.dumps({"apiVersion":"v1","kind":"List","items":resources}))
              Path(f"/tmp/{c}-{version}-workloads.json").write_text(json.dumps(workloads,sort_keys=True))
          PY

      - name: Install exact kind runtime
        shell: bash
        run: |
          set -euo pipefail
          url="$(jq -r '.spec.kind.url' runtime/network-stack-kind-toolchain.json)"
          expected="$(jq -r '.spec.kind.sha256' runtime/network-stack-kind-toolchain.json)"
          size="$(jq -r '.spec.kind.sizeBytes' runtime/network-stack-kind-toolchain.json)"
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/kind "$url"
          test "$(stat -c %s /tmp/kind)" = "$size"
          test "$(sha256sum /tmp/kind|awk '{print $1}')" = "$expected"
          chmod +x /tmp/kind
          image="$(jq -r --arg v "${{ matrix.kubernetes }}" '.spec.kubernetes[]|select(.version==$v)|.nodeImage' runtime/network-stack-kind-toolchain.json)"
          case "$image" in kindest/node:v${{ matrix.kubernetes }}@sha256:*) ;; *) echo "KIND_NODE_IMAGE_NOT_PINNED" >&2; exit 22;; esac
          /tmp/kind create cluster --name "4so-${{ matrix.component }}-upgrade" --image "$image"
          test "$(kubectl version -o json | jq -r .serverVersion.gitVersion)" = "v${{ matrix.kubernetes }}"

      - name: Install historical release and prove workload readiness
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          kubectl create namespace "$NAMESPACE"
          if test "$(jq '.items|length' "/tmp/$COMPONENT-$FROM_RELEASE-crds.json")" -gt 0; then
            kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f "/tmp/$COMPONENT-$FROM_RELEASE-crds.json"
            for crd in $(jq -r '.items[].metadata.name' "/tmp/$COMPONENT-$FROM_RELEASE-crds.json"); do
              kubectl wait --for=condition=Established "crd/$crd" --timeout=4m
            done
          fi
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f "/tmp/$COMPONENT-$FROM_RELEASE-resources.json"
          python3 - <<'PY' >/tmp/wait-old.sh
          import json,os
          rows=json.load(open(f"/tmp/{os.environ['COMPONENT']}-{os.environ['FROM_RELEASE']}-workloads.json"))
          print("set -euo pipefail")
          for r in rows:
              kind=r["kind"].lower()
              ns=r["namespace"]
              name=r["name"]
              if kind=="deployment":
                  print(f"kubectl -n {ns} rollout status deployment/{name} --timeout=12m")
              elif kind=="daemonset":
                  print(f"kubectl -n {ns} rollout status daemonset/{name} --timeout=12m")
              else:
                  print(f"kubectl -n {ns} rollout status statefulset/{name} --timeout=12m")
          PY
          bash /tmp/wait-old.sh
          python3 - <<'PY'
          import json,os,subprocess
          c=os.environ["COMPONENT"]; f=os.environ["FROM_RELEASE"]
          rows=json.load(open(f"/tmp/{c}-{f}-workloads.json"))
          uids={}
          for r in rows:
              raw=subprocess.check_output(["kubectl","-n",r["namespace"],"get",r["kind"].lower(),r["name"],"-o","json"])
              obj=json.loads(raw); uids[f'{r["kind"]}/{r["namespace"]}/{r["name"]}']=obj["metadata"]["uid"]
          if not uids: raise SystemExit("HELM_UPGRADE_HISTORICAL_UID_SET_EMPTY")
          json.dump(uids,open("/tmp/before-uids.json","w"),sort_keys=True)
          PY

      - name: Upgrade target release and prove convergence
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          for job in $(jq -r '.items[]|select(.kind=="Job")|(.metadata.namespace // env.NAMESPACE)+"/"+.metadata.name' "/tmp/$COMPONENT-$TO_RELEASE-resources.json"); do
            ns="${job%%/*}"; name="${job#*/}"; kubectl -n "$ns" delete job "$name" --ignore-not-found --wait=true
          done
          if test "$(jq '.items|length' "/tmp/$COMPONENT-$TO_RELEASE-crds.json")" -gt 0; then
            kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f "/tmp/$COMPONENT-$TO_RELEASE-crds.json"
            for crd in $(jq -r '.items[].metadata.name' "/tmp/$COMPONENT-$TO_RELEASE-crds.json"); do
              kubectl wait --for=condition=Established "crd/$crd" --timeout=4m
              kubectl get "crd/$crd" -o json | jq -e '[.status.storedVersions[] as $s|.spec.versions[]|select(.name==$s)]|length>0' >/dev/null
            done
          fi
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f "/tmp/$COMPONENT-$TO_RELEASE-resources.json"
          python3 - <<'PY' >/tmp/wait-new.sh
          import json,os
          rows=json.load(open(f"/tmp/{os.environ['COMPONENT']}-{os.environ['TO_RELEASE']}-workloads.json"))
          print("set -euo pipefail")
          for r in rows:
              kind=r["kind"].lower(); ns=r["namespace"]; name=r["name"]
              print(f"kubectl -n {ns} rollout status {kind}/{name} --timeout=12m")
          PY
          bash /tmp/wait-new.sh
          python3 - <<'PY'
          import json,os,subprocess
          c=os.environ["COMPONENT"]; t=os.environ["TO_RELEASE"]
          before=json.load(open("/tmp/before-uids.json"))
          rows=json.load(open(f"/tmp/{c}-{t}-workloads.json"))
          common=0
          for r in rows:
              key=f'{r["kind"]}/{r["namespace"]}/{r["name"]}'
              raw=subprocess.check_output(["kubectl","-n",r["namespace"],"get",r["kind"].lower(),r["name"],"-o","json"])
              obj=json.loads(raw)
              if key in before:
                  common+=1
                  if before[key]!=obj["metadata"]["uid"]:
                      raise SystemExit(f"HELM_UPGRADE_WORKLOAD_IDENTITY_DRIFT {key}")
              pod=((obj.get("spec") or {}).get("template") or {}).get("spec") or {}
              live=[x.get("image","") for x in [*(pod.get("initContainers") or []),*(pod.get("containers") or [])] if x.get("image")]
              if live!=r["images"]:
                  raise SystemExit(f"HELM_UPGRADE_TARGET_IMAGE_DRIFT {key} expected={r['images']} actual={live}")
          if common<1: raise SystemExit("HELM_UPGRADE_NO_PRESERVED_WORKLOAD_IDENTITY")
          PY
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f "/tmp/$COMPONENT-$TO_RELEASE-crds.json" >/tmp/reapply-crds.txt || true
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f "/tmp/$COMPONENT-$TO_RELEASE-resources.json" >/tmp/reapply-resources.txt
          bash /tmp/wait-new.sh

      - name: Prove reverse edge and seal evidence
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          MATRIX_KUBERNETES: ${{ matrix.kubernetes }}
        run: |
          set -euo pipefail
          go test ./internal/runtimeupgrade -run 'TestUpgradeRejectsReverseOrNonCanonicalVersionEdges|TestUpgradeRequiresExactDistinctSourcePair'
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          h=lambda p:"sha256:"+hashlib.sha256(Path(p).read_bytes()).hexdigest()
          c=os.environ["COMPONENT"]; f=os.environ["FROM_RELEASE"]; t=os.environ["TO_RELEASE"]; v=os.environ["MATRIX_KUBERNETES"]; rk=os.environ["RENDER_KUBERNETES"]
          out={"apiVersion":"platform.4so.io/v1alpha1","kind":"HelmComponentUpgradeRuntimeEvidence","authority":"HELM_COMPONENT_RUNTIME_UPGRADE_EVIDENCE_V1","component":c,"sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],"kubernetesVersion":v,"sourceRenderKubernetesVersion":rk,"fromRelease":f,"toRelease":t,"historicalReady":True,"upgradeApplyPass":True,"targetReady":True,"workloadIdentityPreserved":True,"targetImagesVerified":True,"targetReapplyConverged":True,"reverseEdgeRejected":True,"genericKubernetesRuntimeEvidenceOnly":True,"rke2Certified":False,"productTopologyHACertified":False,"physicalCertified":False,"fromRuntimeRenderSha256":h(f"/tmp/{c}-{f}.json"),"toRuntimeRenderSha256":h(f"/tmp/{c}-{t}.json")}
          Path(f"/tmp/{c}-upgrade-{v}.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: helm-upgrade-${{ matrix.component }}-${{ matrix.kubernetes }}
          path: /tmp/${{ matrix.component }}-upgrade-${{ matrix.kubernetes }}.json
          retention-days: 30

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          kubectl get pods,deployments,daemonsets,statefulsets,jobs -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -150 || true

      - if: always()
        run: /tmp/kind delete cluster --name "4so-${{ matrix.component }}-upgrade" || true

  aggregate:
    needs: upgrade-matrix
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: helm-upgrade-*
          path: /tmp/helm-upgrade
          merge-multiple: true
      - name: Aggregate exact Helm component upgrade matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in sorted(Path("/tmp/helm-upgrade").glob("*-upgrade-*.json"))]
          profiles={"capsule":("0.13.10","0.13.11"),"victoria-metrics":("0.90.1","0.90.2")}
          outrows=[]
          required=("historicalReady","upgradeApplyPass","targetReady","workloadIdentityPreserved","targetImagesVerified","targetReapplyConverged","reverseEdgeRejected")
          for c,(f,t) in profiles.items():
              found=[r for r in rows if r.get("component")==c]
              if {r.get("kubernetesVersion") for r in found}!={"1.34.11","1.35.8"}: raise SystemExit(f"HELM_UPGRADE_MATRIX_COVERAGE_INVALID {c}")
              if any((r.get("fromRelease"),r.get("toRelease"))!=(f,t) for r in found): raise SystemExit(f"HELM_UPGRADE_EDGE_DRIFT {c}")
              if not all(all(r.get(k) is True for k in required) and r.get("genericKubernetesRuntimeEvidenceOnly") is True and r.get("rke2Certified") is False and r.get("productTopologyHACertified") is False and r.get("physicalCertified") is False for r in found): raise SystemExit(f"HELM_UPGRADE_RUNTIME_INVALID {c}")
              outrows.append({"component":c,"fromRelease":f,"toRelease":t,"matrix":sorted(found,key=lambda x:x["kubernetesVersion"]),"matrixPass":True})
          out={"apiVersion":"platform.4so.io/v1alpha1","kind":"HelmComponentUpgradeRuntimeMatrixEvidence","authority":"HELM_COMPONENT_RUNTIME_UPGRADE_MATRIX_V1","sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],"components":outrows,"matrixPass":True,"genericKubernetesRuntimeEvidenceOnly":True,"rke2Certified":False,"productTopologyHACertified":False,"physicalCertified":False}
          Path("lab/helm-component-upgrade-runtime-matrix-evidence.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: helm-component-upgrade-runtime-matrix
          path: lab/helm-component-upgrade-runtime-matrix-evidence.json
          retention-days: 30
      - name: Persist evidence when main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 4so-evidence-bot
          git config user.email actions@users.noreply.github.com
          git add lab/helm-component-upgrade-runtime-matrix-evidence.json
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo "main advanced; skip stale Helm upgrade evidence"
            git reset -- lab/helm-component-upgrade-runtime-matrix-evidence.json
            exit 0
          fi
          git commit -m "evidence: seal Helm component runtime upgrades"
          git push origin HEAD:main
