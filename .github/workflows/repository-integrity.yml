name: repository-integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clean-clone-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert canonical project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f VERSION
          test -f README.md
          test -f AGENTS.md
          test -f Makefile
          test -f go.mod
          for path in cmd internal webconsole migrations scripts tests deploy schemas catalog blueprints docs examples; do
            test -e "$path"
          done
          test "$(find . -name .git -print | wc -l)" -eq 1
          test -z "$(git status --porcelain)"

      - name: Repository validator
        run: python3 scripts/validate_repository.py .

      - name: Go build and tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go build ./cmd/...

      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Explicit clean-clone verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/project-git-verification
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/project-git-verification
          cd /tmp/project-git-verification
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          python3 scripts/validate_repository.py .
          go test ./...
