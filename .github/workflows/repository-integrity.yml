name: repository-integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clean-clone-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert canonical project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f VERSION
          test -f README.md
          test -f AGENTS.md
          test -f Makefile
          test -f go.mod
          for path in cmd internal webconsole migrations scripts tests deploy schemas catalog blueprints docs examples providers/terraform providers/crossplane; do
            test -e "$path"
          done
          test "$(find . -name .git -print | wc -l)" -eq 1
          test -z "$(git status --porcelain)"

      - name: Repository validator
        run: python3 scripts/validate_repository.py .

      - name: Go build and tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go build ./cmd/...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/4so-crossplane-provider ./cmd/provider
          test -s /tmp/4so-crossplane-provider

      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Autopilot checkpoint and recovery self-test
        run: python3 scripts/codex_autopilot.py --self-test

      - name: Installer isolated smoke shard
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          ldflags="-s -w -buildid= -X platform.4so.io/factory/internal/buildinfo.Version=${version}"
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o bin/platformctl ./cmd/platformctl
          CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o bin/platform-installer ./cmd/platform-installer
          python3 scripts/run_smoke_shard.py --shard 4

      - name: Explicit clean-clone verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/project-git-verification
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/project-git-verification
          cd /tmp/project-git-verification
          git checkout --quiet --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          python3 scripts/validate_repository.py .
          go test ./...

  postgres-behavioral-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: factory_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d factory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4

      - name: Install libpq development headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: PostgreSQL behavioral integration
        env:
          PLATFORM_FACTORY_POSTGRES_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/factory_test?sslmode=disable
        run: make test-postgres-integration


  terraform-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4

      - name: Install exact Terraform provider Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
          cache-dependency-path: providers/terraform/go.sum

      - name: Build and test Terraform provider
        working-directory: providers/terraform
        shell: bash
        run: |
          set -euo pipefail
          go version
          go test ./...
          go vet ./...
          go build ./...


  crossplane-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4

      - name: Install exact Crossplane provider Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: false

      - name: Build and test Crossplane provider
        working-directory: providers/crossplane
        shell: bash
        run: |
          set -euo pipefail
          go version
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
          go vet ./...
          go build ./cmd/...
