name: canonical-sync-transport-probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/canonical-sync-transport-probe.yml']

permissions:
  contents: read

jobs:
  export-current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export current tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/current-main.tar.gz HEAD
          git rev-parse HEAD > /tmp/current-main.sha
          git rev-parse HEAD^{tree} > /tmp/current-main.tree
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-sync-transport-probe
          path: |
            /tmp/current-main.tar.gz
            /tmp/current-main.sha
            /tmp/current-main.tree
          retention-days: 1
