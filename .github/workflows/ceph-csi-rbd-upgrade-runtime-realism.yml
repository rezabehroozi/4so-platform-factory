name: ceph-csi-rbd-upgrade-runtime-realism
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ceph-csi-rbd-upgrade-runtime-realism.yml
      - scripts/ceph_csi_driver_image_set.py
      - lab/ceph-csi-driver-image-set-evidence.json
      - catalog/runtime/ceph-csi-operator/1.0.4/**
      - catalog/runtime/ceph-csi-rbd/1.0.3/**
      - catalog/runtime/ceph-csi-rbd/1.0.4/**
  workflow_run:
    workflows: ["ceph-csi-driver-image-set-authority"]
    types: [completed]
permissions:
  contents: write
jobs:
  runtime-matrix:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.34.11","1.35.8"]
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind exact authority and render source pair
        run: |
          set -euo pipefail
          python3 scripts/ceph_csi_driver_image_set.py --verify
          case "${{ matrix.kubernetes }}" in 1.34.11) render=1.34.0;; 1.35.8) render=1.35.0;; *) exit 20;; esac
          echo "RENDER_KUBERNETES=$render" >> "$GITHUB_ENV"
          python3 scripts/render_exact_helm_runtime.py --component ceph-csi-operator --release 1.0.4 --kube-version "$render" --out /tmp/operator.json --evidence /tmp/operator-evidence.json
          python3 scripts/render_exact_helm_runtime.py --component ceph-csi-rbd --release 1.0.3 --kube-version "$render" --out /tmp/rbd-from-list.json --evidence /tmp/rbd-from-evidence.json
          python3 scripts/render_exact_helm_runtime.py --component ceph-csi-rbd --release 1.0.4 --kube-version "$render" --out /tmp/rbd-to-list.json --evidence /tmp/rbd-to-evidence.json
          jq -e '.authority=="EXACT_HELM_RUNTIME_RENDER_V2" and .component=="ceph-csi-operator" and (.images|length)>0 and all(.images[];contains("@sha256:"))' /tmp/operator-evidence.json
          jq -e '.authority=="EXACT_HELM_RUNTIME_RENDER_V2" and .component=="ceph-csi-rbd" and (.images|length)==0' /tmp/rbd-from-evidence.json
          jq -e '.authority=="EXACT_HELM_RUNTIME_RENDER_V2" and .component=="ceph-csi-rbd" and (.images|length)==0' /tmp/rbd-to-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          op=json.loads(Path("/tmp/operator.json").read_text())["items"]
          crds=[x for x in op if x.get("kind")=="CustomResourceDefinition"]
          resources=[x for x in op if x.get("kind")!="CustomResourceDefinition"]
          deployments=[x for x in resources if x.get("kind")=="Deployment" and (x.get("metadata") or {}).get("labels",{}).get("control-plane")=="controller-manager"]
          if not crds or len(deployments)!=1: raise SystemExit("CEPH_CSI_OPERATOR_RENDER_SHAPE_INVALID")
          Path("/tmp/operator-deployment-name").write_text(deployments[0]["metadata"]["name"])
          Path("/tmp/operator-crds.json").write_text(json.dumps({"apiVersion":"v1","kind":"List","items":crds}))
          Path("/tmp/operator-resources.json").write_text(json.dumps({"apiVersion":"v1","kind":"List","items":resources}))
          def driver(path):
              rows=json.loads(Path(path).read_text())["items"]; ds=[x for x in rows if x.get("apiVersion")=="csi.ceph.io/v1" and x.get("kind")=="Driver" and (x.get("metadata") or {}).get("name")=="rbd.csi.ceph.com"]
              if len(ds)!=1: raise SystemExit("CEPH_CSI_RBD_DRIVER_RENDER_INVALID")
              return ds[0]
          old=driver("/tmp/rbd-from-list.json"); new=driver("/tmp/rbd-to-list.json")
          if old.get("spec")!=new.get("spec"): raise SystemExit("CEPH_CSI_RBD_EXPECTED_SEMANTIC_NOOP_DRIFT")
          for row,out in ((old,"/tmp/rbd-from.json"),(new,"/tmp/rbd-to.json")):
              row.setdefault("spec",{})["imageSet"]={"name":"4so-ceph-csi-images"}; Path(out).write_text(json.dumps(row))
          PY
      - name: Install exact kind runtime
        run: |
          set -euo pipefail
          url="$(jq -r '.spec.kind.url' runtime/network-stack-kind-toolchain.json)"
          sha="$(jq -r '.spec.kind.sha256' runtime/network-stack-kind-toolchain.json)"
          size="$(jq -r '.spec.kind.sizeBytes' runtime/network-stack-kind-toolchain.json)"
          curl -fL --retry 3 -o /tmp/kind "$url"
          test "$(sha256sum /tmp/kind|awk '{print $1}')" = "$sha"
          test "$(stat -c %s /tmp/kind)" = "$size"
          chmod +x /tmp/kind
          image="$(jq -r --arg v "${{ matrix.kubernetes }}" '.spec.kubernetes[]|select(.version==$v)|.nodeImage' runtime/network-stack-kind-toolchain.json)"
          /tmp/kind create cluster --name 4so-ceph-rbd-upgrade --image "$image"
          kubectl taint nodes --all node-role.kubernetes.io/control-plane- >/dev/null 2>&1 || true
      - name: Install exact operator and immutable driver image set
        run: |
          set -euo pipefail
          kubectl create namespace ceph-csi-operator-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --server-side --force-conflicts --field-manager=4so-ceph-upgrade -f /tmp/operator-crds.json
          for crd in $(jq -r '.items[].metadata.name' /tmp/operator-crds.json); do kubectl wait --for=condition=Established "crd/$crd" --timeout=4m; done
          kubectl -n ceph-csi-operator-system apply --server-side --force-conflicts --field-manager=4so-ceph-upgrade -f /tmp/operator-resources.json
          operator_deployment="$(cat /tmp/operator-deployment-name)"
          kubectl -n ceph-csi-operator-system rollout status "deployment/$operator_deployment" --timeout=12m
          python3 - <<'PY' >/tmp/image-set.json
          import json
          d=json.load(open("lab/ceph-csi-driver-image-set-evidence.json"))
          print(json.dumps({"apiVersion":"v1","kind":"ConfigMap","metadata":{"name":"4so-ceph-csi-images","namespace":"ceph-csi-operator-system"},"data":{x["key"]:x["exactReference"] for x in d["images"]}}))
          PY
          kubectl apply -f /tmp/image-set.json
      - name: Install historical Driver and prove generated runtime
        run: |
          set -euo pipefail
          kubectl apply --server-side --force-conflicts --field-manager=4so-ceph-upgrade -f /tmp/rbd-from.json
          kubectl -n ceph-csi-operator-system rollout status deployment/rbd.csi.ceph.com-ctrlplugin --timeout=12m
          kubectl -n ceph-csi-operator-system rollout status daemonset/rbd.csi.ceph.com-nodeplugin --timeout=12m
          kubectl get csidriver rbd.csi.ceph.com
          echo "OLD_DRIVER_UID=$(kubectl -n ceph-csi-operator-system get driver rbd.csi.ceph.com -o jsonpath='{.metadata.uid}')" >> "$GITHUB_ENV"
          echo "OLD_DEPLOY_UID=$(kubectl -n ceph-csi-operator-system get deployment rbd.csi.ceph.com-ctrlplugin -o jsonpath='{.metadata.uid}')" >> "$GITHUB_ENV"
          echo "OLD_DS_UID=$(kubectl -n ceph-csi-operator-system get daemonset rbd.csi.ceph.com-nodeplugin -o jsonpath='{.metadata.uid}')" >> "$GITHUB_ENV"
          kubectl -n ceph-csi-operator-system get deployment rbd.csi.ceph.com-ctrlplugin -o json | jq -e '([.spec.template.spec.initContainers[]?.image,.spec.template.spec.containers[]?.image]|all(contains("@sha256:")))'
          kubectl -n ceph-csi-operator-system get daemonset rbd.csi.ceph.com-nodeplugin -o json | jq -e '([.spec.template.spec.initContainers[]?.image,.spec.template.spec.containers[]?.image]|all(contains("@sha256:")))'
      - name: Upgrade exact target and prove convergence
        run: |
          set -euo pipefail
          kubectl apply --server-side --force-conflicts --field-manager=4so-ceph-upgrade -f /tmp/rbd-to.json
          kubectl -n ceph-csi-operator-system rollout status deployment/rbd.csi.ceph.com-ctrlplugin --timeout=12m
          kubectl -n ceph-csi-operator-system rollout status daemonset/rbd.csi.ceph.com-nodeplugin --timeout=12m
          test "$(kubectl -n ceph-csi-operator-system get driver rbd.csi.ceph.com -o jsonpath='{.metadata.uid}')" = "$OLD_DRIVER_UID"
          test "$(kubectl -n ceph-csi-operator-system get deployment rbd.csi.ceph.com-ctrlplugin -o jsonpath='{.metadata.uid}')" = "$OLD_DEPLOY_UID"
          test "$(kubectl -n ceph-csi-operator-system get daemonset rbd.csi.ceph.com-nodeplugin -o jsonpath='{.metadata.uid}')" = "$OLD_DS_UID"
          kubectl -n ceph-csi-operator-system get driver rbd.csi.ceph.com -o json > /tmp/live-driver.json
          jq -S '.spec' /tmp/live-driver.json > /tmp/live-spec.json
          jq -S '.spec' /tmp/rbd-to.json > /tmp/target-spec.json
          diff -u /tmp/target-spec.json /tmp/live-spec.json
          kubectl apply --server-side --force-conflicts --field-manager=4so-ceph-upgrade -f /tmp/rbd-to.json
          go test ./internal/runtimeupgrade -run 'TestUpgradeRejectsReverseOrNonCanonicalVersionEdges|TestUpgradeRequiresExactDistinctSourcePair'
      - name: Seal shard evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def h(p): return "sha256:"+hashlib.sha256(Path(p).read_bytes()).hexdigest()
          out={"apiVersion":"platform.4so.io/v1alpha1","kind":"CephCSIRBDRuntimeUpgradeEvidence","authority":"CEPH_CSI_RBD_RUNTIME_UPGRADE_EVIDENCE_V1","component":"ceph-csi-rbd","fromRelease":"1.0.3","toRelease":"1.0.4","kubernetesVersion":"${{ matrix.kubernetes }}","sourceRunId":os.environ["GITHUB_RUN_ID"],"sourceCommitSHA":os.environ["GITHUB_SHA"],"historicalRenderSha256":h("/tmp/rbd-from.json"),"targetRenderSha256":h("/tmp/rbd-to.json"),"imageSetSha256":h("lab/ceph-csi-driver-image-set-evidence.json"),"historicalReady":True,"upgradeApplyPass":True,"targetReady":True,"driverIdentityPreserved":True,"generatedDeploymentIdentityPreserved":True,"generatedDaemonSetIdentityPreserved":True,"targetSpecReadbackVerified":True,"generatedImagesDigestPinned":True,"targetReapplyConverged":True,"reverseEdgeRejected":True,"semanticNoopSourceRender":True,"genericKubernetesRuntimeEvidenceOnly":True,"rke2Certified":False,"productTopologyHACertified":False,"physicalCertified":False}
          Path("/tmp/ceph-csi-rbd-upgrade-${{ matrix.kubernetes }}.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ceph-csi-rbd-upgrade-${{ matrix.kubernetes }}
          path: /tmp/ceph-csi-rbd-upgrade-${{ matrix.kubernetes }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods,deployments,daemonsets,statefulsets -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -150 || true
      - if: always()
        run: /tmp/kind delete cluster --name 4so-ceph-rbd-upgrade || true
  aggregate:
    needs: runtime-matrix
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ceph-csi-rbd-upgrade-*
          path: /tmp/ceph-rbd-evidence
      - name: Merge and verify owner evidence
        run: |
          set -euo pipefail
          python3 scripts/merge_ceph_csi_rbd_upgrade_evidence.py --artifacts /tmp/ceph-rbd-evidence
          python3 scripts/runtime_evidence_registry.py
          python3 -m unittest tests.test_runtime_evidence_registry
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: ceph-csi-rbd-upgrade-matrix
          path: |
            lab/ceph-csi-rbd-upgrade-runtime-matrix-evidence.json
            catalog/component-runtime-upgrade-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist exact matrix if owner inputs are unchanged
        run: |
          python3 scripts/persist_evidence_if_inputs_unchanged.py \
            --source-sha "$GITHUB_SHA" --message "evidence: seal Ceph RBD runtime upgrade" \
            --input scripts/merge_ceph_csi_rbd_upgrade_evidence.py \
            --input scripts/runtime_evidence_registry.py \
            --input lab/ceph-csi-driver-image-set-evidence.json \
            --input catalog/runtime/ceph-csi-rbd/1.0.3/source-lock.json \
            --input catalog/runtime/ceph-csi-rbd/1.0.4/source-lock.json \
            --input catalog/runtime/ceph-csi-operator/1.0.4/source-lock.json \
            --output lab/ceph-csi-rbd-upgrade-runtime-matrix-evidence.json \
            --output catalog/component-runtime-upgrade-evidence.json
