name: metallb-runtime-realism

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/metallb-runtime-realism.yml
      - runtime/network-stack-kind-toolchain.json
      - catalog/runtime/metallb/0.16.1/**
      - catalog/component-runtime-certification.json

permissions:
  contents: write

jobs:
  runtime-matrix:
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.34.11", "1.35.8"]
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install exact kind
        shell: bash
        run: |
          set -euo pipefail
          url="$(jq -r '.spec.kind.url' runtime/network-stack-kind-toolchain.json)"
          expected="$(jq -r '.spec.kind.sha256' runtime/network-stack-kind-toolchain.json)"
          size="$(jq -r '.spec.kind.sizeBytes' runtime/network-stack-kind-toolchain.json)"
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/kind "$url"
          test "$(stat -c %s /tmp/kind)" = "$size"
          test "$(sha256sum /tmp/kind | awk '{print $1}')" = "$expected"
          chmod +x /tmp/kind
      - name: Create exact Kubernetes matrix member
        shell: bash
        run: |
          set -euo pipefail
          image="$(jq -r --arg v "${{ matrix.kubernetes }}" '.spec.kubernetes[] | select(.version==$v) | .nodeImage' runtime/network-stack-kind-toolchain.json)"
          test -n "$image" && test "$image" != null
          /tmp/kind create cluster --name 4so-metallb --image "$image" --wait 5m
          test "$(kubectl version -o json | jq -r '.serverVersion.gitVersion')" = "v${{ matrix.kubernetes }}"
      - name: Apply exact MetalLB 0.16.1 render
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("catalog/runtime/metallb/0.16.1/render-manifest.json")
          items=json.loads(p.read_text())
          if not items: raise SystemExit("METALLB_RENDER_EMPTY")
          refs=[]
          def walk(v):
              if isinstance(v,dict):
                  for k,x in v.items():
                      if k=="image" and isinstance(x,str): refs.append(x)
                      walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(items)
          if not refs or any("@sha256:" not in ref for ref in refs):
              raise SystemExit("METALLB_RENDER_MUTABLE_IMAGE")
          Path("/tmp/metallb-list.json").write_text(json.dumps({"apiVersion":"v1","kind":"List","items":items}))
          PY
          kubectl create namespace metallb-system
          kubectl apply -f /tmp/metallb-list.json
          for crd in ipaddresspools.metallb.io l2advertisements.metallb.io bgpadvertisements.metallb.io; do kubectl wait --for=condition=Established "crd/$crd" --timeout=3m; done
          kubectl -n metallb-system rollout status deployment/platform-factory-metallb-controller --timeout=8m
          kubectl -n metallb-system rollout status daemonset/platform-factory-metallb-speaker --timeout=8m
      - name: Prove L2 configuration admission
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/l2.yaml <<'YAML'
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata: {name: runtime-proof, namespace: metallb-system}
          spec:
            addresses: [172.18.255.240-172.18.255.250]
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata: {name: runtime-proof, namespace: metallb-system}
          spec:
            ipAddressPools: [runtime-proof]
          YAML
          kubectl apply -f /tmp/l2.yaml
          kubectl -n metallb-system get ipaddresspool/runtime-proof l2advertisement/runtime-proof
      - name: Seal claim-scoped evidence
        shell: bash
        env:
          MATRIX_KUBERNETES: ${{ matrix.kubernetes }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path("catalog/runtime/metallb/0.16.1/render-manifest.json")
          receipt={"apiVersion":"platform.4so.io/v1alpha1","kind":"MetalLBRuntimeRealismEvidence","authority":"METALLB_RUNTIME_REALISM_EVIDENCE_V1","sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],"kubernetesVersion":os.environ["MATRIX_KUBERNETES"],"metallbRelease":"0.16.1","renderSha256":"sha256:"+hashlib.sha256(p.read_bytes()).hexdigest(),"controllerReady":True,"speakerReady":True,"crdsEstablished":True,"l2ConfigurationAdmissionPass":True,"runtimeRealismPass":True,"genericKubernetesRuntimeEvidenceOnly":True,"cveDispositionResolved":False,"runtimeHoldReleased":False,"rke2Certified":False,"physicalCertified":False}
          Path("/tmp/metallb-runtime.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          PY
          jq -e '.runtimeRealismPass and .genericKubernetesRuntimeEvidenceOnly and (.cveDispositionResolved|not) and (.runtimeHoldReleased|not) and (.rke2Certified|not) and (.physicalCertified|not)' /tmp/metallb-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: metallb-runtime-${{ matrix.kubernetes }}
          path: /tmp/metallb-runtime.json
          if-no-files-found: error
          retention-days: 30
      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          kubectl get nodes -o wide
          kubectl get pods -A -o wide
          kubectl -n metallb-system describe deployment/platform-factory-metallb-controller
          kubectl -n metallb-system describe daemonset/platform-factory-metallb-speaker
      - name: Delete cluster
        if: always()
        shell: bash
        run: /tmp/kind delete cluster --name 4so-metallb || true

  aggregate-evidence:
    needs: runtime-matrix
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: metallb-runtime-*
          path: /tmp/metallb-evidence
      - name: Aggregate exact matrix without releasing suitability hold
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[]
          for p in sorted(Path("/tmp/metallb-evidence").rglob("metallb-runtime.json")):
              row=json.loads(p.read_text())
              if row.get("authority")!="METALLB_RUNTIME_REALISM_EVIDENCE_V1" or row.get("sourceCommitSHA")!=os.environ["GITHUB_SHA"] or row.get("sourceRunId")!=os.environ["GITHUB_RUN_ID"]:
                  raise SystemExit("METALLB_MATRIX_EVIDENCE_SOURCE_MISMATCH")
              if row.get("runtimeRealismPass") is not True or row.get("genericKubernetesRuntimeEvidenceOnly") is not True:
                  raise SystemExit("METALLB_MATRIX_MEMBER_NOT_PASS")
              if any(row.get(k) is not False for k in ("cveDispositionResolved","runtimeHoldReleased","rke2Certified","physicalCertified")):
                  raise SystemExit("METALLB_MATRIX_MEMBER_SCOPE_INFLATION")
              rows.append(row)
          versions=sorted(r["kubernetesVersion"] for r in rows)
          if versions != ["1.34.11","1.35.8"]:
              raise SystemExit("METALLB_MATRIX_COVERAGE_INVALID "+repr(versions))
          digests={r["renderSha256"] for r in rows}
          if len(digests)!=1:
              raise SystemExit("METALLB_MATRIX_RENDER_DRIFT")
          out={"apiVersion":"platform.4so.io/v1alpha1","kind":"MetalLBRuntimeMatrixEvidence","authority":"METALLB_RUNTIME_MATRIX_EVIDENCE_V1","sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],"metallbRelease":"0.16.1","renderSha256":next(iter(digests)),"kubernetesVersions":versions,"matrixPass":True,"genericKubernetesRuntimeEvidenceOnly":True,"cveDispositionResolved":False,"runtimeHoldReleased":False,"rke2Certified":False,"physicalCertified":False}
          Path("lab/metallb-runtime-matrix-evidence.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          python3 scripts/validate_repository.py .
          git diff --check
      - name: Persist aggregate evidence when main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4so-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/metallb-runtime-matrix-evidence.json
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo "main advanced; skip stale MetalLB evidence persistence"
            git reset -- lab/metallb-runtime-matrix-evidence.json
            exit 0
          fi
          git commit -m "evidence: seal MetalLB runtime matrix"
          git push origin HEAD:main
