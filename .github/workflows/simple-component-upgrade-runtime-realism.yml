name: simple-component-upgrade-runtime-realism

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/simple-component-upgrade-runtime-realism.yml
      - catalog/runtime/alloy/1.10.1/**
      - catalog/runtime/alloy/1.11.0/**
      - catalog/runtime/grafana/12.9.0/**
      - catalog/runtime/grafana/12.10.0/**
      - catalog/component-runtime-upgrade-matrix.json
      - internal/runtimeupgrade/**

permissions:
  contents: write

jobs:
  upgrade-matrix:
    strategy:
      fail-fast: false
      matrix:
        component: [alloy, grafana]
        kubernetes: ["1.34.11", "1.35.8"]
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Bind exact component-owned upgrade profile
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            alloy)
              from=1.10.1; to=1.11.0; ns=logging; kind=daemonset; workload=platform-factory-alloy
              ;;
            grafana)
              from=12.9.0; to=12.10.0; ns=monitoring; kind=deployment; workload=platform-factory-grafana
              ;;
            *) echo "UNSUPPORTED_COMPONENT_PROFILE $COMPONENT" >&2; exit 20 ;;
          esac
          export FROM_RELEASE="$from" TO_RELEASE="$to" NAMESPACE="$ns" WORKLOAD_KIND="$kind" WORKLOAD_NAME="$workload"
          printf '%s\n' "FROM_RELEASE=$from" "TO_RELEASE=$to" "NAMESPACE=$ns" "WORKLOAD_KIND=$kind" "WORKLOAD_NAME=$workload" >> "$GITHUB_ENV"
          jq -e --arg c "$COMPONENT" --arg f "$from" --arg t "$to" '
            .components[] | select(.component==$c and .targetRelease==$t and .status=="admitted-source-pair")
            | .admittedEdges[] | select(.fromRelease==$f and .toRelease==$t)
          ' catalog/component-runtime-upgrade-matrix.json >/tmp/edge.json
          test -s "catalog/runtime/$COMPONENT/$from/render-manifest.json"
          test -s "catalog/runtime/$COMPONENT/$to/render-manifest.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          c=os.environ["COMPONENT"]; f=os.environ["FROM_RELEASE"]; t=os.environ["TO_RELEASE"]
          for version in (f,t):
              p=Path(f"catalog/runtime/{c}/{version}/render-manifest.json")
              items=json.loads(p.read_text())
              if not isinstance(items,list) or not items:
                  raise SystemExit(f"UPGRADE_RENDER_EMPTY {c}:{version}")
              workloads=[x for x in items if x.get("kind","").lower()==os.environ["WORKLOAD_KIND"] and (x.get("metadata") or {}).get("name")==os.environ["WORKLOAD_NAME"]]
              if len(workloads)!=1:
                  raise SystemExit(f"UPGRADE_WORKLOAD_IDENTITY_INVALID {c}:{version}")
              images=[z.get("image","") for z in (((workloads[0].get("spec") or {}).get("template") or {}).get("spec") or {}).get("containers",[])]
              if not images or any("@sha256:" not in x for x in images):
                  raise SystemExit(f"UPGRADE_IMAGE_NOT_DIGEST_PINNED {c}:{version}:{images}")
              Path(f"/tmp/{c}-{version}.json").write_text(json.dumps({"apiVersion":"v1","kind":"List","items":items}))
              Path(f"/tmp/{c}-{version}-images.json").write_text(json.dumps(images,sort_keys=True))
          PY

      - name: Install exact kind runtime
        shell: bash
        run: |
          set -euo pipefail
          url="$(jq -r '.spec.kind.url' runtime/network-stack-kind-toolchain.json)"
          expected="$(jq -r '.spec.kind.sha256' runtime/network-stack-kind-toolchain.json)"
          size="$(jq -r '.spec.kind.sizeBytes' runtime/network-stack-kind-toolchain.json)"
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/kind "$url"
          test "$(stat -c %s /tmp/kind)" = "$size"
          test "$(sha256sum /tmp/kind|awk '{print $1}')" = "$expected"
          chmod +x /tmp/kind
          image="$(jq -r --arg v "${{ matrix.kubernetes }}" '.spec.kubernetes[]|select(.version==$v)|.nodeImage' runtime/network-stack-kind-toolchain.json)"
          case "$image" in kindest/node:v${{ matrix.kubernetes }}@sha256:*) ;; *) echo "KIND_NODE_IMAGE_NOT_PINNED" >&2; exit 21;; esac
          /tmp/kind create cluster --name "4so-${{ matrix.component }}-upgrade" --image "$image"
          test "$(kubectl version -o json | jq -r .serverVersion.gitVersion)" = "v${{ matrix.kubernetes }}"

      - name: Install historical release and prove readiness
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace "$NAMESPACE"
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f "/tmp/${{ matrix.component }}-$FROM_RELEASE.json"
          kubectl -n "$NAMESPACE" rollout status "$WORKLOAD_KIND/$WORKLOAD_NAME" --timeout=10m
          before_uid="$(kubectl -n "$NAMESPACE" get "$WORKLOAD_KIND/$WORKLOAD_NAME" -o jsonpath='{.metadata.uid}')"
          test -n "$before_uid"
          echo "BEFORE_UID=$before_uid" >> "$GITHUB_ENV"

      - name: Upgrade to target release and prove convergence
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f "/tmp/${{ matrix.component }}-$TO_RELEASE.json"
          kubectl -n "$NAMESPACE" rollout status "$WORKLOAD_KIND/$WORKLOAD_NAME" --timeout=10m
          after_uid="$(kubectl -n "$NAMESPACE" get "$WORKLOAD_KIND/$WORKLOAD_NAME" -o jsonpath='{.metadata.uid}')"
          test "$after_uid" = "$BEFORE_UID"
          expected="$(cat "/tmp/${{ matrix.component }}-$TO_RELEASE-images.json")"
          actual="$(kubectl -n "$NAMESPACE" get "$WORKLOAD_KIND/$WORKLOAD_NAME" -o json | jq -c '[.spec.template.spec.containers[].image]')"
          test "$actual" = "$expected"
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f "/tmp/${{ matrix.component }}-$TO_RELEASE.json" >/tmp/reapply.txt
          kubectl -n "$NAMESPACE" rollout status "$WORKLOAD_KIND/$WORKLOAD_NAME" --timeout=4m

      - name: Prove reverse edge is rejected by product executor
        run: go test ./internal/runtimeupgrade -run 'TestUpgradeRejectsReverseOrNonCanonicalVersionEdges|TestUpgradeRequiresExactDistinctSourcePair'

      - name: Seal component-owned runtime evidence
        shell: bash
        env:
          MATRIX_KUBERNETES: ${{ matrix.kubernetes }}
          COMPONENT: ${{ matrix.component }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          c=os.environ["COMPONENT"]; f=os.environ["FROM_RELEASE"]; t=os.environ["TO_RELEASE"]; v=os.environ["MATRIX_KUBERNETES"]
          def h(p): return "sha256:"+hashlib.sha256(Path(p).read_bytes()).hexdigest()
          out={
            "apiVersion":"platform.4so.io/v1alpha1","kind":"SimpleComponentUpgradeRuntimeEvidence",
            "authority":"SIMPLE_COMPONENT_RUNTIME_UPGRADE_EVIDENCE_V1","component":c,
            "sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],
            "kubernetesVersion":v,"fromRelease":f,"toRelease":t,
            "fromRenderSha256":h(f"catalog/runtime/{c}/{f}/render-manifest.json"),
            "toRenderSha256":h(f"catalog/runtime/{c}/{t}/render-manifest.json"),
            "historicalReady":True,"upgradeApplyPass":True,"targetReady":True,
            "workloadIdentityPreserved":True,"targetReapplyConverged":True,"reverseEdgeRejected":True,
            "genericKubernetesRuntimeEvidenceOnly":True,"rke2Certified":False,
            "productTopologyHACertified":False,"physicalCertified":False
          }
          Path(f"/tmp/{c}-upgrade-{v}.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: simple-upgrade-${{ matrix.component }}-${{ matrix.kubernetes }}
          path: /tmp/${{ matrix.component }}-upgrade-${{ matrix.kubernetes }}.json
          retention-days: 30

      - if: always()
        run: /tmp/kind delete cluster --name "4so-${{ matrix.component }}-upgrade" || true

  aggregate:
    needs: upgrade-matrix
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: simple-upgrade-*
          path: /tmp/simple-upgrade
          merge-multiple: true
      - name: Aggregate component-owned upgrade matrices
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in sorted(Path("/tmp/simple-upgrade").glob("*-upgrade-*.json"))]
          profiles={"alloy":("1.10.1","1.11.0"),"grafana":("12.9.0","12.10.0")}
          outrows=[]
          for c,(f,t) in profiles.items():
              found=[r for r in rows if r.get("component")==c]
              if {r.get("kubernetesVersion") for r in found}!={"1.34.11","1.35.8"}:
                  raise SystemExit(f"SIMPLE_UPGRADE_MATRIX_COVERAGE_INVALID {c}")
              if any((r.get("fromRelease"),r.get("toRelease"))!=(f,t) for r in found):
                  raise SystemExit(f"SIMPLE_UPGRADE_EDGE_DRIFT {c}")
              required=("historicalReady","upgradeApplyPass","targetReady","workloadIdentityPreserved","targetReapplyConverged","reverseEdgeRejected")
              if not all(all(r.get(k) is True for k in required) for r in found):
                  raise SystemExit(f"SIMPLE_UPGRADE_RUNTIME_INVALID {c}")
              outrows.append({"component":c,"fromRelease":f,"toRelease":t,"matrix":sorted(found,key=lambda x:x["kubernetesVersion"]),"matrixPass":True})
          out={"apiVersion":"platform.4so.io/v1alpha1","kind":"SimpleComponentUpgradeRuntimeMatrixEvidence","authority":"SIMPLE_COMPONENT_RUNTIME_UPGRADE_MATRIX_V1","sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],"components":outrows,"matrixPass":True,"genericKubernetesRuntimeEvidenceOnly":True,"rke2Certified":False,"productTopologyHACertified":False,"physicalCertified":False}
          Path("lab/simple-component-upgrade-runtime-matrix-evidence.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: simple-component-upgrade-runtime-matrix
          path: lab/simple-component-upgrade-runtime-matrix-evidence.json
          retention-days: 30
      - name: Persist evidence when main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4so-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/simple-component-upgrade-runtime-matrix-evidence.json
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo "main advanced; skip stale simple upgrade evidence"
            git reset -- lab/simple-component-upgrade-runtime-matrix-evidence.json
            exit 0
          fi
          git commit -m "evidence: seal simple component runtime upgrades"
          if ! git push origin HEAD:main; then
            git fetch origin main
            if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
              echo "main advanced after simple upgrade evidence commit; skip stale persistence"
              exit 0
            fi
            exit 1
          fi
