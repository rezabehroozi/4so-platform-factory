name: mcp-external-receipt-recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-authority-notice:
    runs-on: ubuntu-latest
    steps:
      - name: C7W recovery authority is local-only
        shell: bash
        run: |
          set -euo pipefail
          echo "This workflow is intentionally non-authoritative and performs no receipt recovery or Git persistence."
          echo "Recovery is owned by the local C7W state and runner."
          echo "Inspect with: <python> scripts/run_mcp_external_interop.py --state-dir <state-dir> status"
          echo "For an expired campaign, follow PREPARE_REPLACEMENT_C7W_CAMPAIGN and use --allow-campaign-supersede only on the first admission when the returned handoff requires it."
