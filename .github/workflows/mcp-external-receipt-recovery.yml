name: mcp-external-receipt-recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-authority-notice:
    runs-on: ubuntu-latest
    steps:
      - name: C7W recovery authority is local-only
        shell: bash
        run: |
          set -euo pipefail
          echo "This workflow is intentionally non-authoritative and performs no receipt recovery or Git persistence."
          echo "Recovery is owned by the local C7W state and runner."
          echo "Inspect with: make c7w-status"
          echo "For an expired or explicitly replaced incomplete campaign, prepare a new state directory and use the fenced C7W_ALLOW_CAMPAIGN_SUPERSEDE=true path."
