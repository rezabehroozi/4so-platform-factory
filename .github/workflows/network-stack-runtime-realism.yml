name: network-stack-runtime-realism

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/network-stack-runtime-realism.yml
      - runtime/network-stack-kind-toolchain.json
      - catalog/runtime-dependency-transition.json
      - catalog/runtime-dependencies/gateway-api/1.6.1/**
      - catalog/runtime/cilium/1.20.1/**
      - catalog/runtime/kgateway/2.4.1/**
      - tests/test_network_stack_kind_toolchain.py

permissions:
  contents: write

jobs:
  runtime-matrix:
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.34.11", "1.35.8"]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4

      - name: Install exact kind
        shell: bash
        run: |
          set -euo pipefail
          url="$(jq -r '.spec.kind.url' runtime/network-stack-kind-toolchain.json)"
          expected="$(jq -r '.spec.kind.sha256' runtime/network-stack-kind-toolchain.json)"
          size="$(jq -r '.spec.kind.sizeBytes' runtime/network-stack-kind-toolchain.json)"
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/kind "$url"
          test "$(stat -c %s /tmp/kind)" = "$size"
          test "$(sha256sum /tmp/kind | awk '{print $1}')" = "$expected"
          chmod +x /tmp/kind
          /tmp/kind version
          kubectl version --client

      - name: Resolve exact matrix node image
        shell: bash
        run: |
          set -euo pipefail
          image="$(jq -r --arg v "${{ matrix.kubernetes }}" '.spec.kubernetes[] | select(.version==$v) | .nodeImage' runtime/network-stack-kind-toolchain.json)"
          test -n "$image" && test "$image" != "null"
          case "$image" in kindest/node:v${{ matrix.kubernetes }}@sha256:*) ;; *) echo "NODE_IMAGE_AUTHORITY_INVALID $image" >&2; exit 21;; esac
          echo "KIND_NODE_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Create two-node Kubernetes without default CNI
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/kind.yaml <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
          nodes:
          - role: control-plane
          - role: worker
          YAML
          /tmp/kind create cluster --name 4so-net --image "$KIND_NODE_IMAGE" --config /tmp/kind.yaml
          for i in $(seq 1 60); do
            if kubectl cluster-info --context kind-4so-net >/dev/null 2>&1; then break; fi
            sleep 2
          done
          kubectl cluster-info --context kind-4so-net
          test "$(kubectl get nodes -o json | jq '.items | length')" = "2"
          kubectl version -o json > /tmp/kubectl-version.json
          test "$(jq -r '.serverVersion.gitVersion' /tmp/kubectl-version.json)" = "v${{ matrix.kubernetes }}"

      - name: Install exact Gateway API 1.6.1 target bytes
        shell: bash
        run: |
          set -euo pipefail
          file=catalog/runtime-dependencies/gateway-api/1.6.1/standard-install.yaml
          expected="$(jq -r '.spec.gatewayApi.assets[] | select(.name=="standard-install.yaml") | .sha256' catalog/runtime-dependency-transition.json)"
          size="$(jq -r '.spec.gatewayApi.assets[] | select(.name=="standard-install.yaml") | .size' catalog/runtime-dependency-transition.json)"
          test "$(stat -c %s "$file")" = "$size"
          test "$(sha256sum "$file" | awk '{print $1}')" = "$expected"
          kubectl apply -f "$file"
          kubectl wait --for=condition=Established crd/gateways.gateway.networking.k8s.io --timeout=2m
          kubectl wait --for=condition=Established crd/gatewayclasses.gateway.networking.k8s.io --timeout=2m

      - name: Apply exact digest-pinned Cilium render
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          src=Path("catalog/runtime/cilium/1.20.1/render-manifest.json")
          items=json.loads(src.read_text())
          refs=[]
          def walk(v):
              if isinstance(v,dict):
                  for k,x in v.items():
                      if k=="image" and isinstance(x,str):
                          refs.append(x)
                      walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(items)
          if not refs or any("@sha256:" not in ref for ref in refs):
              raise SystemExit("CILIUM_RENDER_MUTABLE_IMAGE")
          Path("/tmp/cilium-list.json").write_text(json.dumps({"apiVersion":"v1","kind":"List","items":items}))
          PY
          kubectl apply -f /tmp/cilium-list.json
          kubectl -n kube-system rollout status daemonset/cilium --timeout=10m
          kubectl -n kube-system rollout status daemonset/cilium-envoy --timeout=10m
          kubectl -n kube-system rollout status deployment/cilium-operator --timeout=10m
          kubectl wait --for=condition=Ready nodes --all --timeout=10m
          desired="$(kubectl -n kube-system get ds cilium -o jsonpath='{.status.desiredNumberScheduled}')"
          ready="$(kubectl -n kube-system get ds cilium -o jsonpath='{.status.numberReady}')"
          test "$desired" = "2" && test "$ready" = "2"

      - name: Prove pod and service connectivity through Cilium
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace cilium-runtime-test
          kubectl -n cilium-runtime-test create deployment echo --image=registry.k8s.io/e2e-test-images/agnhost:2.53 -- /agnhost netexec --http-port=8080
          kubectl -n cilium-runtime-test expose deployment echo --port=80 --target-port=8080
          kubectl -n cilium-runtime-test rollout status deployment/echo --timeout=5m
          kubectl -n cilium-runtime-test run client --image=registry.k8s.io/e2e-test-images/agnhost:2.53 --restart=Never --command -- /bin/sh -ec 'for i in $(seq 1 30); do wget -qO- http://echo/hostname && exit 0; sleep 2; done; exit 1'
          kubectl -n cilium-runtime-test wait --for=jsonpath='{.status.phase}'=Succeeded pod/client --timeout=3m
          kubectl -n cilium-runtime-test logs client

      - name: Apply exact digest-pinned KGateway render
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace gateway-system
          python3 - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path("catalog/runtime/kgateway/2.4.1/render-manifest.json").read_text())
          refs=[]
          def walk(v):
              if isinstance(v,dict):
                  for k,x in v.items():
                      if k=="image" and isinstance(x,str): refs.append(x)
                      walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(items)
          if not refs or any("@sha256:" not in ref for ref in refs):
              raise SystemExit("KGATEWAY_RENDER_MUTABLE_IMAGE")
          Path("/tmp/kgateway-list.json").write_text(json.dumps({"apiVersion":"v1","kind":"List","items":items}))
          PY
          kubectl apply -f /tmp/kgateway-list.json
          kubectl -n gateway-system rollout status deployment/platform-factory-kgateway --timeout=10m
          kubectl -n gateway-system get deployment/platform-factory-kgateway -o json > /tmp/kgateway-deployment.json
          test "$(jq -r '.status.availableReplicas // 0' /tmp/kgateway-deployment.json)" -ge 1

      - name: Seal per-version runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          kubectl get nodes -o json > /tmp/nodes.json
          kubectl -n kube-system get ds cilium -o json > /tmp/cilium-ds.json
          kubectl -n kube-system get deploy cilium-operator -o json > /tmp/cilium-operator.json
          kubectl get crd gateways.gateway.networking.k8s.io -o json > /tmp/gateway-crd.json
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def h(path):
              return "sha256:"+hashlib.sha256(Path(path).read_bytes()).hexdigest()
          version=os.environ["MATRIX_KUBERNETES"]
          tool=json.loads(Path("runtime/network-stack-kind-toolchain.json").read_text())
          node=[r["nodeImage"] for r in tool["spec"]["kubernetes"] if r["version"]==version][0]
          receipt={
            "apiVersion":"platform.4so.io/v1alpha1",
            "kind":"NetworkStackRuntimeRealismEvidence",
            "authority":"NETWORK_STACK_RUNTIME_REALISM_EVIDENCE_V1",
            "sourceCommitSHA":os.environ["GITHUB_SHA"],
            "sourceRunId":os.environ["GITHUB_RUN_ID"],
            "kubernetesVersion":version,
            "nodeImage":node,
            "kindVersion":tool["spec"]["kind"]["version"],
            "gatewayApiRelease":"1.6.1",
            "gatewayApiStandardManifestSha256":h("catalog/runtime-dependencies/gateway-api/1.6.1/standard-install.yaml"),
            "ciliumRelease":"1.20.1",
            "ciliumRenderSha256":h("catalog/runtime/cilium/1.20.1/render-manifest.json"),
            "kgatewayRelease":"2.4.1",
            "kgatewayRenderSha256":h("catalog/runtime/kgateway/2.4.1/render-manifest.json"),
            "nodeCount":len(json.loads(Path("/tmp/nodes.json").read_text())["items"]),
            "allNodesReady":True,
            "ciliumDaemonSetReady":True,
            "ciliumOperatorReady":True,
            "gatewayApiCRDEstablished":True,
            "podServiceConnectivityPass":True,
            "kgatewayDeploymentReady":True,
            "runtimeRealismPass":True,
            "genericKubernetesRuntimeEvidenceOnly":True,
            "rke2Certified":False,
            "physicalCertified":False,
            "runtimeHoldAutoReleased":False
          }
          out=Path(f"/tmp/network-stack-{version}.json")
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          PY
          jq -e '.runtimeRealismPass == true and .genericKubernetesRuntimeEvidenceOnly == true and .rke2Certified == false and .physicalCertified == false and .runtimeHoldAutoReleased == false' "/tmp/network-stack-${{ matrix.kubernetes }}.json" >/dev/null
        env:
          MATRIX_KUBERNETES: ${{ matrix.kubernetes }}

      - name: Upload per-version runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: network-stack-runtime-${{ matrix.kubernetes }}
          path: /tmp/network-stack-${{ matrix.kubernetes }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Capture diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          kubectl get nodes -o wide
          kubectl get pods -A -o wide
          kubectl -n kube-system describe ds/cilium
          kubectl -n kube-system logs ds/cilium --tail=120
          kubectl -n gateway-system describe deployment/platform-factory-kgateway
          kubectl -n gateway-system logs deployment/platform-factory-kgateway --tail=120

      - name: Delete ephemeral cluster
        if: always()
        shell: bash
        run: /tmp/kind delete cluster --name 4so-net || true

  aggregate:
    needs: runtime-matrix
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download matrix evidence
        uses: actions/download-artifact@v4
        with:
          pattern: network-stack-runtime-*
          path: /tmp/network-stack
          merge-multiple: true

      - name: Aggregate claim-scoped runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          rows=[]
          for path in sorted(Path("/tmp/network-stack").glob("network-stack-*.json")):
              row=json.loads(path.read_text())
              if row["authority"]!="NETWORK_STACK_RUNTIME_REALISM_EVIDENCE_V1" or not row["runtimeRealismPass"]:
                  raise SystemExit("NETWORK_STACK_MATRIX_EVIDENCE_INVALID")
              if row["rke2Certified"] or row["physicalCertified"] or row["runtimeHoldAutoReleased"]:
                  raise SystemExit("NETWORK_STACK_MATRIX_SCOPE_INFLATION")
              rows.append(row)
          if {r["kubernetesVersion"] for r in rows}!={"1.34.11","1.35.8"}:
              raise SystemExit("NETWORK_STACK_MATRIX_COVERAGE_INVALID")
          receipt={
            "apiVersion":"platform.4so.io/v1alpha1",
            "kind":"NetworkStackRuntimeMatrixEvidence",
            "authority":"NETWORK_STACK_RUNTIME_MATRIX_EVIDENCE_V1",
            "sourceCommitSHA":os.environ["GITHUB_SHA"],
            "sourceRunId":os.environ["GITHUB_RUN_ID"],
            "matrix":rows,
            "gatewayApiRelease":"1.6.1",
            "ciliumRelease":"1.20.1",
            "kgatewayRelease":"2.4.1",
            "matrixPass":True,
            "genericKubernetesRuntimeEvidenceOnly":True,
            "ciliumRuntimeHoldReviewReady":True,
            "ciliumRuntimeHoldReleased":False,
            "remainingRuntimeSuitabilityHolds":["cilium","kyverno","metallb"],
            "rke2Certified":False,
            "physicalCertified":False
          }
          Path("lab/network-stack-runtime-matrix-evidence.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          PY
          jq -e '.matrixPass and .ciliumRuntimeHoldReviewReady and (.ciliumRuntimeHoldReleased|not) and (.rke2Certified|not) and (.physicalCertified|not)' lab/network-stack-runtime-matrix-evidence.json >/dev/null
          git diff --check

      - name: Upload aggregate runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: network-stack-runtime-matrix
          path: lab/network-stack-runtime-matrix-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit Git-safe runtime matrix evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4so-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/network-stack-runtime-matrix-evidence.json
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced; skipping stale network evidence persistence"
            git reset --hard "$GITHUB_SHA"
            exit 0
          fi
          git commit -m "evidence: seal network stack runtime matrix"
          git push origin HEAD:main
