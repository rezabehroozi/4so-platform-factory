name: kgateway-upgrade-runtime-realism-local-only-notice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-authority-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Local execution authority
        shell: bash
        run: |
          set -euo pipefail
          echo "This historical workflow is intentionally non-authoritative."
          echo "Runtime, validation, evidence generation, checkpoint/resume and release execution are local-only."
          echo "Use repository-local owner commands and .project-runtime state; Git remains version-control/sync only."
