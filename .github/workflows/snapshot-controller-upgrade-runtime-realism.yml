name: snapshot-controller-upgrade-runtime-realism

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/snapshot-controller-upgrade-runtime-realism.yml
      - catalog/components/snapshot-controller.json
      - catalog/runtime/snapshot-controller/8.4.0/**
      - catalog/runtime/snapshot-controller/8.5.0/**
      - catalog/component-runtime-upgrade-matrix.json
      - internal/runtimeupgrade/**

permissions:
  contents: write

jobs:
  upgrade-matrix:
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.34.11", "1.35.8"]
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Bind exact admitted Snapshot Controller edge
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.spec.release' catalog/components/snapshot-controller.json)" = "8.5.0"
          jq -e '.components[] | select(.component=="snapshot-controller" and .targetRelease=="8.5.0" and .status=="admitted-source-pair") | .admittedEdges[] | select(.fromRelease=="8.4.0" and .toRelease=="8.5.0")' catalog/component-runtime-upgrade-matrix.json >/tmp/edge.json
          test -s catalog/runtime/snapshot-controller/8.4.0/render-manifest.json
          test -s catalog/runtime/snapshot-controller/8.5.0/render-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for version in ("8.4.0","8.5.0"):
              p=Path(f"catalog/runtime/snapshot-controller/{version}/render-manifest.json")
              items=json.loads(p.read_text())
              if len(items)!=9:
                  raise SystemExit(f"SNAPSHOT_RENDER_RESOURCE_COUNT_INVALID {version}:{len(items)}")
              kinds={x.get("kind") for x in items}
              required={"CustomResourceDefinition","ServiceAccount","ClusterRole","ClusterRoleBinding","Role","RoleBinding","Deployment"}
              if not required.issubset(kinds):
                  raise SystemExit(f"SNAPSHOT_RENDER_KIND_COVERAGE_INVALID {version}:{sorted(kinds)}")
              deployments=[x for x in items if x.get("kind")=="Deployment" and x.get("metadata",{}).get("name")=="snapshot-controller"]
              if len(deployments)!=1:
                  raise SystemExit(f"SNAPSHOT_DEPLOYMENT_IDENTITY_INVALID {version}")
              images=[c.get("image","") for c in deployments[0].get("spec",{}).get("template",{}).get("spec",{}).get("containers",[])]
              if len(images)!=1 or "@sha256:" not in images[0]:
                  raise SystemExit(f"SNAPSHOT_IMAGE_NOT_DIGEST_PINNED {version}:{images}")
              Path(f"/tmp/snapshot-{version}.json").write_text(json.dumps({"apiVersion":"v1","kind":"List","items":items}))
              Path(f"/tmp/snapshot-{version}-image.txt").write_text(images[0]+"\n")
          PY

      - name: Install exact kind runtime
        shell: bash
        run: |
          set -euo pipefail
          url="$(jq -r '.spec.kind.url' runtime/network-stack-kind-toolchain.json)"
          expected="$(jq -r '.spec.kind.sha256' runtime/network-stack-kind-toolchain.json)"
          size="$(jq -r '.spec.kind.sizeBytes' runtime/network-stack-kind-toolchain.json)"
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/kind "$url"
          test "$(stat -c %s /tmp/kind)" = "$size"
          test "$(sha256sum /tmp/kind|awk '{print $1}')" = "$expected"
          chmod +x /tmp/kind
          image="$(jq -r --arg v "${{ matrix.kubernetes }}" '.spec.kubernetes[]|select(.version==$v)|.nodeImage' runtime/network-stack-kind-toolchain.json)"
          case "$image" in kindest/node:v${{ matrix.kubernetes }}@sha256:*) ;; *) echo "KIND_NODE_IMAGE_NOT_PINNED" >&2; exit 21;; esac
          /tmp/kind create cluster --name 4so-snapshot-upgrade --image "$image"
          test "$(kubectl version -o json | jq -r .serverVersion.gitVersion)" = "v${{ matrix.kubernetes }}"

      - name: Install historical 8.4.0 and prove readiness
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f /tmp/snapshot-8.4.0.json
          for crd in $(jq -r '.items[]|select(.kind=="CustomResourceDefinition")|.metadata.name' /tmp/snapshot-8.4.0.json); do
            kubectl wait --for=condition=Established "crd/$crd" --timeout=3m
          done
          kubectl -n kube-system rollout status deployment/snapshot-controller --timeout=8m
          old_expected="$(cat /tmp/snapshot-8.4.0-image.txt)"
          old_actual="$(kubectl -n kube-system get deploy snapshot-controller -o jsonpath='{.spec.template.spec.containers[0].image}')"
          test "$old_actual" = "$old_expected"

      - name: Upgrade to exact 8.5.0 and prove convergence
        shell: bash
        run: |
          set -euo pipefail
          before_uid="$(kubectl -n kube-system get deployment snapshot-controller -o jsonpath='{.metadata.uid}')"
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f /tmp/snapshot-8.5.0.json
          for crd in $(jq -r '.items[]|select(.kind=="CustomResourceDefinition")|.metadata.name' /tmp/snapshot-8.5.0.json); do
            kubectl wait --for=condition=Established "crd/$crd" --timeout=3m
            kubectl get "crd/$crd" -o json | jq -e '.status.conditions[]|select(.type=="Established" and .status=="True")' >/dev/null
            kubectl get "crd/$crd" -o json | jq -e '[.status.storedVersions[] as $s | .spec.versions[] | select(.name==$s)] | length > 0' >/dev/null
          done
          kubectl -n kube-system rollout status deployment/snapshot-controller --timeout=8m
          new_expected="$(cat /tmp/snapshot-8.5.0-image.txt)"
          new_actual="$(kubectl -n kube-system get deploy snapshot-controller -o jsonpath='{.spec.template.spec.containers[0].image}')"
          test "$new_actual" = "$new_expected"
          after_uid="$(kubectl -n kube-system get deployment snapshot-controller -o jsonpath='{.metadata.uid}')"
          test "$before_uid" = "$after_uid"
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f /tmp/snapshot-8.5.0.json >/tmp/reapply.txt
          kubectl -n kube-system rollout status deployment/snapshot-controller --timeout=4m

      - name: Prove product edge direction remains fail-closed
        run: go test ./internal/runtimeupgrade -run 'TestUpgradeRejectsReverseOrNonCanonicalVersionEdges|TestUpgradeRequiresExactDistinctSourcePair'

      - name: Seal per-version Snapshot Controller upgrade evidence
        shell: bash
        env:
          MATRIX_KUBERNETES: ${{ matrix.kubernetes }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def h(p): return "sha256:"+hashlib.sha256(Path(p).read_bytes()).hexdigest()
          v=os.environ["MATRIX_KUBERNETES"]
          out={
            "apiVersion":"platform.4so.io/v1alpha1",
            "kind":"SnapshotControllerUpgradeRuntimeEvidence",
            "authority":"SNAPSHOT_CONTROLLER_RUNTIME_UPGRADE_EVIDENCE_V1",
            "sourceCommitSHA":os.environ["GITHUB_SHA"],
            "sourceRunId":os.environ["GITHUB_RUN_ID"],
            "kubernetesVersion":v,
            "fromRelease":"8.4.0","toRelease":"8.5.0",
            "fromRenderSha256":h("catalog/runtime/snapshot-controller/8.4.0/render-manifest.json"),
            "toRenderSha256":h("catalog/runtime/snapshot-controller/8.5.0/render-manifest.json"),
            "oldReady":True,"upgradeApplyPass":True,"targetReady":True,
            "deploymentIdentityPreserved":True,"targetReapplyConverged":True,
            "reverseEdgeRejected":True,
            "genericKubernetesRuntimeEvidenceOnly":True,
            "rke2Certified":False,"productTopologyHACertified":False,"physicalCertified":False
          }
          Path(f"/tmp/snapshot-upgrade-{v}.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-controller-upgrade-${{ matrix.kubernetes }}
          path: /tmp/snapshot-upgrade-${{ matrix.kubernetes }}.json
          retention-days: 30

      - if: always()
        run: /tmp/kind delete cluster --name 4so-snapshot-upgrade || true

  aggregate:
    needs: upgrade-matrix
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: snapshot-controller-upgrade-*
          path: /tmp/snapshot-upgrade
          merge-multiple: true
      - name: Aggregate exact Snapshot Controller upgrade evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in sorted(Path("/tmp/snapshot-upgrade").glob("snapshot-upgrade-*.json"))]
          if {r["kubernetesVersion"] for r in rows}!={"1.34.11","1.35.8"}:
              raise SystemExit("SNAPSHOT_UPGRADE_MATRIX_COVERAGE_INVALID")
          if not all(r["oldReady"] and r["upgradeApplyPass"] and r["targetReady"] and r["deploymentIdentityPreserved"] and r["targetReapplyConverged"] and r["reverseEdgeRejected"] for r in rows):
              raise SystemExit("SNAPSHOT_UPGRADE_MATRIX_RUNTIME_INVALID")
          out={
            "apiVersion":"platform.4so.io/v1alpha1","kind":"SnapshotControllerUpgradeRuntimeMatrixEvidence",
            "authority":"SNAPSHOT_CONTROLLER_RUNTIME_UPGRADE_MATRIX_V1",
            "sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],
            "fromRelease":"8.4.0","toRelease":"8.5.0","matrix":rows,"matrixPass":True,
            "genericKubernetesRuntimeEvidenceOnly":True,"rke2Certified":False,
            "productTopologyHACertified":False,"physicalCertified":False
          }
          Path("lab/snapshot-controller-upgrade-runtime-matrix-evidence.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-controller-upgrade-runtime-matrix
          path: lab/snapshot-controller-upgrade-runtime-matrix-evidence.json
          retention-days: 30
      - name: Persist evidence when main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4so-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/snapshot-controller-upgrade-runtime-matrix-evidence.json
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo "main advanced; skip stale Snapshot Controller upgrade evidence"
            git reset -- lab/snapshot-controller-upgrade-runtime-matrix-evidence.json
            exit 0
          fi
          git commit -m "evidence: seal Snapshot Controller runtime upgrade matrix"
          git push origin HEAD:main
