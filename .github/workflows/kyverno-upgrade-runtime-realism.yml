name: kyverno-upgrade-runtime-realism

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/kyverno-upgrade-runtime-realism.yml
      - catalog/runtime.go
      - catalog/runtime_normalization.go
      - catalog/runtime/kyverno/3.8.1/**
      - catalog/runtime/kyverno/3.8.2/**
      - catalog/components/kyverno.json
      - catalog/component-runtime-upgrade-matrix.json
      - internal/runtimeupgrade/**

permissions:
  contents: write

jobs:
  upgrade-matrix:
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.34.11", "1.35.8"]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Bind exact Kyverno edge and normalized target
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .components[] | select(.component=="kyverno" and .targetRelease=="3.8.2" and .status=="admitted-source-pair")
            | .admittedEdges[] | select(.fromRelease=="3.8.1" and .toRelease=="3.8.2")
          ' catalog/component-runtime-upgrade-matrix.json >/tmp/edge.json
          go build -o /tmp/catalog-runtime-render ./cmd/catalog-runtime-render
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("catalog/runtime/kyverno/3.8.1/render-manifest.json")
          items=json.loads(p.read_text())
          if not isinstance(items,list) or not items:
              raise SystemExit("KYVERNO_381_RENDER_EMPTY")
          images=[]
          for obj in items:
              spec=((obj.get("spec") or {}).get("template") or {}).get("spec") or {}
              for c in spec.get("containers") or []:
                  if c.get("image"): images.append(c["image"])
          if not images or any("@sha256:" not in x for x in images):
              raise SystemExit("KYVERNO_381_IMAGE_NOT_DIGEST_PINNED")
          Path("/tmp/kyverno-3.8.1.json").write_text(json.dumps({"apiVersion":"v1","kind":"List","items":items}))
          PY
          /tmp/catalog-runtime-render --component kyverno --namespace kyverno --release-id "upgrade-$GITHUB_SHA" --out /tmp/kyverno-3.8.2.json --evidence /tmp/kyverno-target-render-evidence.json
          jq -e '.version=="3.8.2" and .runtimeNormalization.authority=="KYVERNO_3_8_2_GITOPS_CRD_NORMALIZATION_V1" and .runtimeNormalization.applied and .runtimeNormalization.removedEmptyLabels==11 and .runtimeNormalization.removedEmptyAnnotations==11' /tmp/kyverno-target-render-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path("/tmp/kyverno-3.8.2.json").read_text())["items"]
          images=[]
          for obj in items:
              spec=((obj.get("spec") or {}).get("template") or {}).get("spec") or {}
              for c in spec.get("containers") or []:
                  if c.get("image"): images.append(c["image"])
          if not images or any("@sha256:" not in x for x in images):
              raise SystemExit("KYVERNO_382_IMAGE_NOT_DIGEST_PINNED")
          PY

      - name: Install exact kind runtime
        shell: bash
        run: |
          set -euo pipefail
          url="$(jq -r '.spec.kind.url' runtime/network-stack-kind-toolchain.json)"
          expected="$(jq -r '.spec.kind.sha256' runtime/network-stack-kind-toolchain.json)"
          size="$(jq -r '.spec.kind.sizeBytes' runtime/network-stack-kind-toolchain.json)"
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/kind "$url"
          test "$(stat -c %s /tmp/kind)" = "$size"
          test "$(sha256sum /tmp/kind|awk '{print $1}')" = "$expected"
          chmod +x /tmp/kind
          image="$(jq -r --arg v "${{ matrix.kubernetes }}" '.spec.kubernetes[]|select(.version==$v)|.nodeImage' runtime/network-stack-kind-toolchain.json)"
          case "$image" in kindest/node:v${{ matrix.kubernetes }}@sha256:*) ;; *) exit 21;; esac
          /tmp/kind create cluster --name 4so-kyverno-upgrade --image "$image"
          test "$(kubectl version -o json | jq -r .serverVersion.gitVersion)" = "v${{ matrix.kubernetes }}"

      - name: Install historical Kyverno 3.8.1
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace kyverno
          kubectl apply --server-side --force-conflicts --field-manager=4so-upgrade -f /tmp/kyverno-3.8.1.json
          for crd in $(jq -r '.items[]|select(.kind=="CustomResourceDefinition")|.metadata.name' /tmp/kyverno-3.8.1.json); do
            kubectl wait --for=condition=Established "crd/$crd" --timeout=4m
          done
          kubectl -n kyverno wait --for=condition=Available deployment --all --timeout=12m
          if kubectl -n kyverno get job -o name | grep -q .; then kubectl -n kyverno wait --for=condition=Complete job --all --timeout=12m; fi
          kubectl -n kyverno get deployment -o json | jq -c '[.items[]|{name:.metadata.name,uid:.metadata.uid}]|sort_by(.name)' >/tmp/kyverno-before-uids.json
          test "$(jq length /tmp/kyverno-before-uids.json)" -gt 0

      - name: Upgrade to normalized Kyverno 3.8.2
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply --server-side --force-conflicts --field-manager=argocd-controller -f /tmp/kyverno-3.8.2.json
          for crd in $(jq -r '.items[]|select(.kind=="CustomResourceDefinition")|.metadata.name' /tmp/kyverno-3.8.2.json); do
            kubectl wait --for=condition=Established "crd/$crd" --timeout=4m
            kubectl get "crd/$crd" -o json | jq -e '[.status.storedVersions[] as $s | .spec.versions[] | select(.name==$s)] | length > 0' >/dev/null
          done
          kubectl -n kyverno wait --for=condition=Available deployment --all --timeout=12m
          if kubectl -n kyverno get job -o name | grep -q .; then kubectl -n kyverno wait --for=condition=Complete job --all --timeout=12m; fi
          kubectl -n kyverno get deployment -o json | jq -c '[.items[]|{name:.metadata.name,uid:.metadata.uid}]|sort_by(.name)' >/tmp/kyverno-after-uids.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a={x["name"]:x["uid"] for x in json.loads(Path("/tmp/kyverno-before-uids.json").read_text())}
          b={x["name"]:x["uid"] for x in json.loads(Path("/tmp/kyverno-after-uids.json").read_text())}
          common=set(a)&set(b)
          if not common or any(a[n]!=b[n] for n in common):
              raise SystemExit("KYVERNO_UPGRADE_DEPLOYMENT_IDENTITY_DRIFT")
          PY
          kubectl diff --server-side --field-manager=argocd-controller -f /tmp/kyverno-3.8.2.json >/tmp/kyverno-upgrade-diff.txt

      - name: Prove reverse edge is rejected
        run: go test ./internal/runtimeupgrade -run 'TestUpgradeRejectsReverseOrNonCanonicalVersionEdges|TestUpgradeRequiresExactDistinctSourcePair'

      - name: Seal Kyverno upgrade evidence
        shell: bash
        env:
          MATRIX_KUBERNETES: ${{ matrix.kubernetes }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def h(p): return "sha256:"+hashlib.sha256(Path(p).read_bytes()).hexdigest()
          v=os.environ["MATRIX_KUBERNETES"]
          out={"apiVersion":"platform.4so.io/v1alpha1","kind":"KyvernoUpgradeRuntimeEvidence","authority":"KYVERNO_RUNTIME_UPGRADE_EVIDENCE_V1","sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],"kubernetesVersion":v,"fromRelease":"3.8.1","toRelease":"3.8.2","fromRenderSha256":h("catalog/runtime/kyverno/3.8.1/render-manifest.json"),"normalizedTargetSha256":h("/tmp/kyverno-3.8.2.json"),"normalizationAuthority":"KYVERNO_3_8_2_GITOPS_CRD_NORMALIZATION_V1","historicalReady":True,"upgradeApplyPass":True,"targetReady":True,"deploymentIdentityPreserved":True,"targetReapplyConverged":True,"reverseEdgeRejected":True,"genericKubernetesRuntimeEvidenceOnly":True,"rke2Certified":False,"productTopologyHACertified":False,"physicalCertified":False}
          Path(f"/tmp/kyverno-upgrade-{v}.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kyverno-upgrade-${{ matrix.kubernetes }}
          path: /tmp/kyverno-upgrade-${{ matrix.kubernetes }}.json
          retention-days: 30
      - if: always()
        run: /tmp/kind delete cluster --name 4so-kyverno-upgrade || true

  aggregate:
    needs: upgrade-matrix
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: kyverno-upgrade-*
          path: /tmp/kyverno-upgrade
          merge-multiple: true
      - name: Aggregate exact Kyverno upgrade matrix
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in sorted(Path("/tmp/kyverno-upgrade").glob("kyverno-upgrade-*.json"))]
          if {r["kubernetesVersion"] for r in rows}!={"1.34.11","1.35.8"}: raise SystemExit("KYVERNO_UPGRADE_MATRIX_COVERAGE_INVALID")
          req=("historicalReady","upgradeApplyPass","targetReady","deploymentIdentityPreserved","targetReapplyConverged","reverseEdgeRejected")
          if not all(all(r.get(k) is True for k in req) and r.get("normalizationAuthority")=="KYVERNO_3_8_2_GITOPS_CRD_NORMALIZATION_V1" for r in rows): raise SystemExit("KYVERNO_UPGRADE_MATRIX_INVALID")
          out={"apiVersion":"platform.4so.io/v1alpha1","kind":"KyvernoUpgradeRuntimeMatrixEvidence","authority":"KYVERNO_RUNTIME_UPGRADE_MATRIX_V1","sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],"fromRelease":"3.8.1","toRelease":"3.8.2","normalizationAuthority":"KYVERNO_3_8_2_GITOPS_CRD_NORMALIZATION_V1","matrix":rows,"matrixPass":True,"genericKubernetesRuntimeEvidenceOnly":True,"rke2Certified":False,"productTopologyHACertified":False,"physicalCertified":False}
          Path("lab/kyverno-upgrade-runtime-matrix-evidence.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kyverno-upgrade-runtime-matrix
          path: lab/kyverno-upgrade-runtime-matrix-evidence.json
          retention-days: 30
      - name: Persist evidence when main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4so-evidence-bot"; git config user.email "actions@users.noreply.github.com"
          git add lab/kyverno-upgrade-runtime-matrix-evidence.json
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then echo "main advanced; skip stale Kyverno upgrade evidence"; git reset -- lab/kyverno-upgrade-runtime-matrix-evidence.json; exit 0; fi
          git commit -m "evidence: seal Kyverno runtime upgrade matrix"
          if ! git push origin HEAD:main; then
            git fetch origin main
            if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then echo "main advanced after Kyverno evidence commit; skip stale persistence"; exit 0; fi
            exit 1
          fi
