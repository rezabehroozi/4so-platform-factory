name: management-external-evidence
# retry: exact-cgo-builder-family

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/management-external-evidence.yml

permissions:
  contents: read

jobs:
  exact-release-and-external-images:
    if: contains(github.event.head_commit.message, '[management-external-evidence]')
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
      EXACT_GO: /tmp/4so-exact-go/go/bin/go
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install exact CGO runtime prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Activate admitted exact Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/acquire_release_build_toolchain.py --check
          rm -rf /tmp/4so-exact-go
          mkdir -p /tmp/4so-exact-go
          tar -C /tmp/4so-exact-go -xzf vendor/toolchains/go1.27.1.linux-amd64.tar.gz
          test "$("$EXACT_GO" version)" = "go version go1.27.1 linux/amd64"
          echo "/tmp/4so-exact-go/go/bin" >> "$GITHUB_PATH"
          echo "GO=$EXACT_GO" >> "$GITHUB_ENV"

      - name: Verify exact release build authority
        shell: bash
        run: |
          set -euo pipefail
          "$EXACT_GO" version
          gcc --version | head -1
          ld --version | head -1
          ldd --version | head -1
          python3 scripts/verify_release_build_toolchain.py --require-admitted

      - name: Build and verify exact release artifact
        id: release
        shell: bash
        run: |
          set -euo pipefail
          make build-release GO="$EXACT_GO"
          python3 scripts/build_release.py .
          release="$(find release -maxdepth 1 -type f -name '4so-platform-factory-*.zip' | sort | tail -1)"
          test -s "$release"
          python3 scripts/verify_release.py "$release"
          digest="sha256:$(sha256sum "$release" | awk '{print $1}')"
          echo "path=$release" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "EXACT_RELEASE=$release" >> "$GITHUB_ENV"

      - name: Acquire and offline-verify four external management images
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/4so-management-external
          python3 scripts/acquire_management_workload_batch.py \
            --stage-out /tmp/4so-management-external \
            --release "$EXACT_RELEASE" \
            --platformctl bin/linux-amd64/platformctl
          python3 scripts/acquire_management_workload_batch.py \
            --verify-staged /tmp/4so-management-external \
            --release "$EXACT_RELEASE" \
            --platformctl bin/linux-amd64/platformctl

      - name: Seal Git-safe external image receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/seal_management_external_image_receipt.py \
            --stage /tmp/4so-management-external \
            --release "$EXACT_RELEASE" \
            --plan lab/management-workload-image-build-plan.json \
            --out /tmp/management-workload-external-image-receipt.json \
            --run-id "$GITHUB_RUN_ID"
          cat /tmp/management-workload-external-image-receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble verified external-only OCI archive
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/acquire_management_workload_batch.py \
            --assemble-staged /tmp/4so-management-external \
            --release "$EXACT_RELEASE" \
            --platformctl bin/linux-amd64/platformctl \
            --out /tmp/management-external-images.oci.tar
          test -s /tmp/management-external-images.oci.tar
          sha256sum /tmp/management-external-images.oci.tar > /tmp/management-external-images.oci.tar.sha256

      - name: Upload exact release evidence
        uses: actions/upload-artifact@v4
        with:
          name: exact-release-management-acquisition
          path: |
            ${{ env.EXACT_RELEASE }}
            /tmp/management-workload-external-image-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload external OCI bytes
        uses: actions/upload-artifact@v4
        with:
          name: management-external-images-oci
          path: |
            /tmp/management-external-images.oci.tar
            /tmp/management-external-images.oci.tar.sha256
            /tmp/4so-management-external/stage-manifest.json
            /tmp/4so-management-external/*/acquisition-lock.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
