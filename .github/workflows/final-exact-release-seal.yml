name: final-exact-release-admission-and-seal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-authority-notice:
    runs-on: ubuntu-latest
    steps:
      - name: C9 exact release authority is local-only
        shell: bash
        run: |
          set -euo pipefail
          echo "This workflow is intentionally non-authoritative and performs no exact build, seal, evidence generation, or Git persistence."
          echo "Use the canonical local path:"
          echo "  make c9-admission"
          echo "  make c9-seal"
          echo "The local sealer binds a detached exact-SHA worktree, admitted toolchain, full verifier, exact release snapshot, and machine-actionable post-seal evidence handoff."
