name: final-exact-release-admission-and-seal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-authority-notice:
    runs-on: ubuntu-latest
    steps:
      - name: C9 exact release authority is local-only
        shell: bash
        run: |
          set -euo pipefail
          echo "This workflow is intentionally non-authoritative and performs no exact build, seal, evidence generation, or Git persistence."
          echo "Run C7W status first and follow RUN_C9_SEAL only after canonical C7W evidence is committed."
          echo "Canonical C9 entrypoint: <python> scripts/seal_final_exact_release.py --root . --out lab/final-exact-release-evidence.json"
          echo "The local sealer requires the admitted exact Linux/amd64 Go+CGO toolchain, binds a detached exact-SHA worktree, runs the native binary builder and full verifier, and returns a machine-actionable post-seal evidence handoff."
