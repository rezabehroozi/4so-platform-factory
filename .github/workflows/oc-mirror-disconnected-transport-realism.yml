name: oc-mirror-disconnected-transport-realism

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oc-mirror-disconnected-transport-realism.yml
      - lab/managed-okd-oc-mirror-source-lock.json
      - lab/management-workload-external-image-receipt.json

permissions:
  contents: write
  actions: read

jobs:
  disk-to-tls-zot:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact oc-mirror and source image authorities
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.authority=="MANAGED_OKD_OC_MIRROR_V2_SOURCE_LOCK_V1" and .binaryEvidenceReady and .disconnectedToolchainReady and (.runtimeCertified|not) and (.physicalCertified|not)' lab/managed-okd-oc-mirror-source-lock.json
          echo "OCM_RUN_ID=$(jq -r .binaryEvidence.sourceRunId lab/managed-okd-oc-mirror-source-lock.json)" >> "$GITHUB_ENV"
          echo "OCM_SHA=$(jq -r .binaryEvidence.binarySha256 lab/managed-okd-oc-mirror-source-lock.json)" >> "$GITHUB_ENV"
          echo "OCM_SIZE=$(jq -r .binaryEvidence.binarySizeBytes lab/managed-okd-oc-mirror-source-lock.json)" >> "$GITHUB_ENV"
          echo "SOURCE_IMAGE=$(jq -r '.images[]|select(.role=="zot")|.exactReference' lab/management-workload-external-image-receipt.json)" >> "$GITHUB_ENV"
          echo "ZOT_IMAGE=$(jq -r '.images[]|select(.role=="zot")|.exactReference' lab/management-workload-external-image-receipt.json)" >> "$GITHUB_ENV"

      - name: Download exact retained oc-mirror v2 binary
        uses: actions/download-artifact@v4
        with:
          name: managed-okd-oc-mirror-v2
          path: /tmp/ocmirror-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.OCM_RUN_ID }}

      - name: Verify exact oc-mirror v2 bytes and invocation
        shell: bash
        run: |
          set -euo pipefail
          bin="$(find /tmp/ocmirror-artifact -type f -name oc-mirror-v2 -print -quit)"
          test -f "$bin"
          test "$(stat -c %s "$bin")" = "$OCM_SIZE"
          test "sha256:$(sha256sum "$bin"|awk '{print $1}')" = "$OCM_SHA"
          chmod 0755 "$bin"
          "$bin" --help >/tmp/ocmirror-help.txt
          "$bin" --v2 --help >/tmp/ocmirror-v2-help.txt
          grep -q -- '--from' /tmp/ocmirror-v2-help.txt
          echo "OCM_BIN=$bin" >> "$GITHUB_ENV"

      - name: Create exact mirror-to-disk archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/4so-ocmirror/disk
          cat > /tmp/4so-ocmirror/isc.yaml <<YAML
          kind: ImageSetConfiguration
          apiVersion: mirror.openshift.io/v2alpha1
          mirror:
            additionalImages:
              - name: $SOURCE_IMAGE
          YAML
          "$OCM_BIN" -c /tmp/4so-ocmirror/isc.yaml file:///tmp/4so-ocmirror/disk --v2 --image-timeout=10m
          find /tmp/4so-ocmirror/disk -maxdepth 2 -type f -print | tee /tmp/ocmirror-disk-files.txt
          test "$(find /tmp/4so-ocmirror/disk -type f -name '*.tar' | wc -l)" -ge 1

      - name: Start exact zot with verified TLS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/4so-ocmirror/{certs,zot-data}
          cat > /tmp/4so-ocmirror/openssl.cnf <<'CONF'
          [req]
          distinguished_name=dn
          x509_extensions=v3
          prompt=no
          [dn]
          CN=localhost
          [v3]
          subjectAltName=@alt
          basicConstraints=CA:TRUE
          keyUsage=critical,keyCertSign,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          [alt]
          DNS.1=localhost
          IP.1=127.0.0.1
          CONF
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -config /tmp/4so-ocmirror/openssl.cnf -keyout /tmp/4so-ocmirror/certs/server.key -out /tmp/4so-ocmirror/certs/server.crt
          sudo cp /tmp/4so-ocmirror/certs/server.crt /usr/local/share/ca-certificates/4so-ocmirror-zot.crt
          sudo update-ca-certificates
          cat > /tmp/4so-ocmirror/zot-config.json <<'JSON'
          {
            "distSpecVersion":"1.1.0",
            "storage":{"rootDirectory":"/var/lib/registry","commit":true,"dedupe":true,"gc":true},
            "http":{"address":"0.0.0.0","port":"5443","compat":["docker2s2"],"tls":{"cert":"/etc/zot/certs/server.crt","key":"/etc/zot/certs/server.key"}},
            "log":{"level":"info"},
            "extensions":{"ui":{"enable":false}}
          }
          JSON
          docker pull "$ZOT_IMAGE"
          docker run -d --name 4so-ocmirror-zot -p 5443:5443             -v /tmp/4so-ocmirror/zot-config.json:/etc/zot/config.json:ro             -v /tmp/4so-ocmirror/certs:/etc/zot/certs:ro             -v /tmp/4so-ocmirror/zot-data:/var/lib/registry             "$ZOT_IMAGE" serve /etc/zot/config.json
          for i in $(seq 1 60); do
            curl -fsS https://localhost:5443/v2/ >/dev/null && exit 0
            sleep 1
          done
          docker logs 4so-ocmirror-zot
          exit 31

      - name: Execute disk-to-mirror over TLS and read back exact manifest digest
        shell: bash
        run: |
          set -euo pipefail
          "$OCM_BIN" -c /tmp/4so-ocmirror/isc.yaml --from file:///tmp/4so-ocmirror/disk docker://localhost:5443 --v2 --dest-tls-verify=true --image-timeout=10m
          repo="$(printf '%s' "$SOURCE_IMAGE" | sed -E 's#^[^/]+/([^@]+)@sha256:.*#\1#')"
          digest="${SOURCE_IMAGE##*@}"
          test -n "$repo" && test -n "$digest"
          curl -fsS -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' "https://localhost:5443/v2/$repo/manifests/$digest" -o /tmp/readback-manifest.json
          test -s /tmp/readback-manifest.json
          curl -fsS https://localhost:5443/v2/_catalog | tee /tmp/zot-catalog.json
          jq -e --arg repo "$repo" '.repositories|index($repo)!=null' /tmp/zot-catalog.json
          echo "MIRRORED_REPO=$repo" >> "$GITHUB_ENV"
          echo "MIRRORED_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Seal claim-scoped transport evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          lock=json.loads(Path("lab/managed-okd-oc-mirror-source-lock.json").read_text())
          source=os.environ["SOURCE_IMAGE"]
          rows=sorted(p.relative_to(Path("/tmp/4so-ocmirror/disk")).as_posix() for p in Path("/tmp/4so-ocmirror/disk").rglob("*") if p.is_file())
          digest=hashlib.sha256("\n".join(rows).encode()).hexdigest()
          out={
            "apiVersion":"platform.4so.io/v1alpha1",
            "kind":"OcMirrorDisconnectedTransportEvidence",
            "authority":"OC_MIRROR_DISCONNECTED_TRANSPORT_REALISM_V1",
            "sourceCommitSHA":os.environ["GITHUB_SHA"],
            "sourceRunId":os.environ["GITHUB_RUN_ID"],
            "targetOKDRelease":lock["targetOKDRelease"],
            "ocMirrorSourceCommitSHA":lock["upstreamCommitSHA"],
            "ocMirrorBinarySha256":lock["binaryEvidence"]["binarySha256"],
            "sourceImage":source,
            "mirrorArchiveInventoryDigest":"sha256:"+digest,
            "mirrorArchiveFileCount":len(rows),
            "destinationRegistryAuthority":"zot",
            "destinationTLSVerified":True,
            "diskToMirrorPass":True,
            "registryDigestReadbackPass":True,
            "transportRealismPass":True,
            "fullDisconnectedOKDInstallCertified":False,
            "runtimeCertified":False,
            "physicalCertified":False
          }
          Path("lab/oc-mirror-disconnected-transport-evidence.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          jq -e '.transportRealismPass and .destinationTLSVerified and .diskToMirrorPass and .registryDigestReadbackPass and (.fullDisconnectedOKDInstallCertified|not) and (.runtimeCertified|not) and (.physicalCertified|not)' lab/oc-mirror-disconnected-transport-evidence.json

      - uses: actions/upload-artifact@v4
        with:
          name: oc-mirror-disconnected-transport-realism
          path: |
            lab/oc-mirror-disconnected-transport-evidence.json
            /tmp/zot-catalog.json
          retention-days: 30

      - name: Persist evidence if main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4so-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/oc-mirror-disconnected-transport-evidence.json
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo "main advanced; skip stale transport evidence persistence"
            git reset -- lab/oc-mirror-disconnected-transport-evidence.json
            exit 0
          fi
          git commit -m "evidence: seal oc-mirror disconnected transport realism"
          git push origin HEAD:main

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          docker logs 4so-ocmirror-zot
          find /tmp/4so-ocmirror -maxdepth 4 -type f -print
