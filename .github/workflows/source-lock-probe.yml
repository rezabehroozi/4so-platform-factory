name: source-lock-probe
on:
  push:
    branches: [chatgpt]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Hash immutable upstream source files
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/rancher/rke2/d419f09226d50a4777d348e5c53ea1bce3849b77/install.sh' -o rke2-install.sh
          test "$(git hash-object rke2-install.sh)" = '88c5f55bdfde94f2277465ece2b749c52d86c69b'
          echo "RKE2_INSTALL_GIT_BLOB=$(git hash-object rke2-install.sh)"
          echo "RKE2_INSTALL_SHA256=$(sha256sum rke2-install.sh | awk '{print $1}')"
          echo "RKE2_INSTALL_SIZE=$(wc -c < rke2-install.sh | tr -d ' ')"
          curl -fsSL --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/argoproj/argo-cd/e95e1be88a2da6c06bff5c2fe1791e4d233ed810/manifests/install.yaml' -o argocd-install.yaml
          test "$(git hash-object argocd-install.yaml)" = 'e0ff6c401aa18c2c67ba9dcb5f68f2f15853281f'
          echo "ARGOCD_INSTALL_GIT_BLOB=$(git hash-object argocd-install.yaml)"
          echo "ARGOCD_INSTALL_SHA256=$(sha256sum argocd-install.yaml | awk '{print $1}')"
          echo "ARGOCD_INSTALL_SIZE=$(wc -c < argocd-install.yaml | tr -d ' ')"
