name: exact-sync-temp

on:
  push:
    branches: [sync-0.0.220-exact]

permissions:
  contents: write

jobs:
  apply-exact-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sync-0.0.220-exact

      - name: Apply exact local patch and assert tree
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/*.patch > /tmp/4so220.patch
          git apply --check /tmp/4so220.patch
          git apply /tmp/4so220.patch
          rm -rf .sync .github/workflows/exact-sync-temp.yml
          git add -A
          actual="$(git write-tree)"
          expected="e7efb6469e4dc8f195850f6c15870f470b3a056d"
          echo "expected_tree=${expected}"
          echo "actual_tree=${actual}"
          test "${actual}" = "${expected}"
          git config user.name "4SO exact sync"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: materialize exact 0.0.220 source tree"
          git push origin HEAD:sync-0.0.220-exact
