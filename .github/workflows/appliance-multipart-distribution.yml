name: appliance-multipart-distribution

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["appliance-input-pack"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/appliance-multipart-distribution.yml
      - scripts/distribution_transport.py
      - scripts/prepare_appliance_distribution_parts.py
      - scripts/seal_appliance_bundle_distribution.py
      - scripts/supply_chain_handoff.py
      - tests/test_supply_chain_handoff.py
      - lab/appliance-input-pack-receipt.json
      - lab/management-workload-oci-archive-receipt.json

permissions:
  contents: write
  actions: read

concurrency:
  group: appliance-multipart-distribution-v2
  cancel-in-progress: false

jobs:
  publish-and-seal:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reclaim hosted-runner space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Resolve exact provenance and immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APPLIANCE_RELEASE_TOKEN != '' && secrets.APPLIANCE_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          archive_run="$(jq -r .sourceRunId lab/management-workload-oci-archive-receipt.json)"
          archive_source="$(jq -r .sourceCommitSHA lab/management-workload-oci-archive-receipt.json)"
          pack_run="$(jq -r .sourceRunId lab/appliance-input-pack-receipt.json)"
          pack_source="$(jq -r .sourceCommitSHA lab/appliance-input-pack-receipt.json)"
          pack_artifact_id="$(jq -r .workflowArtifactId lab/appliance-input-pack-receipt.json)"
          [[ "$archive_run" =~ ^[0-9]+$ && "$pack_run" =~ ^[0-9]+$ && "$pack_artifact_id" =~ ^[0-9]+$ ]]
          [[ "$archive_source" =~ ^[0-9a-f]{40}$ && "$pack_source" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$archive_run" --jq .conclusion)" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$archive_run" --jq .head_sha)" = "$archive_source"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pack_run" --jq .conclusion)" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pack_run" --jq .head_sha)" = "$pack_source"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pack_run/artifacts" --jq ".artifacts[] | select(.id==$pack_artifact_id and .name==\"appliance-input-pack\" and (.expired|not)) | .id")" = "$pack_artifact_id"
          version="$(cat VERSION)"
          pack_sha="$(jq -r '.inputPackSha256|sub("^sha256:";"")' lab/appliance-input-pack-receipt.json)"
          tag="appliance-dist-v${version}-${pack_sha:0:16}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if ! gh release create "$tag" --target "$GITHUB_SHA" --title "4SO appliance distribution ${version}" --notes "Content-addressed transport parts for the exact pre-certification appliance input pack. Full-object SHA-256 remains canonical."; then
              echo "::error::APPLIANCE_RELEASE_TOKEN_REQUIRED: built-in GITHUB_TOKEN cannot publish immutable release assets in this repository. Configure a fine-grained APPLIANCE_RELEASE_TOKEN with Contents: write, then rerun."
              exit 73
            fi
          fi
          echo "ARCHIVE_RUN_ID=$archive_run" >> "$GITHUB_ENV"
          echo "PACK_RUN_ID=$pack_run" >> "$GITHUB_ENV"
          echo "DIST_TAG=$tag" >> "$GITHUB_ENV"

      - name: Detect resumable exact public assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APPLIANCE_RELEASE_TOKEN != '' && secrets.APPLIANCE_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/distribution
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DIST_TAG" > /tmp/distribution/release.json
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          release=json.loads(Path("/tmp/distribution/release.json").read_text())
          archive=json.loads(Path("lab/management-workload-oci-archive-receipt.json").read_text())
          pack=json.loads(Path("lab/appliance-input-pack-receipt.json").read_text())
          specs={
            "archive":("platform-workloads.oci.tar",archive["archiveSha256"],archive["archiveBytes"]),
            "inputPack":("appliance-input-pack.zip",pack["inputPackSha256"],pack["inputPackBytes"]),
          }
          assets=release.get("assets") or []
          out={"authority":"APPLIANCE_MULTIPART_DISTRIBUTION_AUTHORITY_V1"}
          complete=True
          for key,(prefix,whole_sha,whole_size) in specs.items():
              rows=[]
              rx=re.compile(r"^"+re.escape(prefix)+r"\.part([0-9]{4})\.sha256-([0-9a-f]{64})$")
              for asset in assets:
                  m=rx.fullmatch(str(asset.get("name") or ""))
                  if not m: continue
                  digest=m.group(2)
                  if asset.get("digest")!="sha256:"+digest or not isinstance(asset.get("size"),int) or asset["size"]<=0:
                      complete=False; continue
                  rows.append({"index":int(m.group(1)),"urls":[asset["browser_download_url"]],"sha256":digest,"sizeBytes":asset["size"]})
              rows.sort(key=lambda x:x["index"])
              if not rows or [r["index"] for r in rows]!=list(range(len(rows))) or sum(r["sizeBytes"] for r in rows)!=whole_size:
                  complete=False
              out[key]={"sha256":whole_sha,"sizeBytes":whole_size,"parts":rows}
          Path("/tmp/distribution/public-manifest.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_ENV"],"a") as fh:
              fh.write("PUBLIC_ASSETS_READY="+("true" if complete else "false")+"\n")
          print("PUBLIC_ASSET_RESUME_READY",complete)
          PY

      - name: Download exact archive artifact
        if: env.PUBLIC_ASSETS_READY != 'true'
        uses: actions/download-artifact@v4
        with:
          name: management-workload-oci-archive
          path: /tmp/archive-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARCHIVE_RUN_ID }}

      - name: Verify, split and publish archive parts
        if: env.PUBLIC_ASSETS_READY != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APPLIANCE_RELEASE_TOKEN != '' && secrets.APPLIANCE_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          archive="$(find /tmp/archive-artifact -type f -name platform-workloads.oci.tar -print -quit)"
          test -f "$archive"
          test "$(sha256sum "$archive"|awk '{print "sha256:"$1}')" = "$(jq -r .archiveSha256 lab/management-workload-oci-archive-receipt.json)"
          test "$(stat -c %s "$archive")" = "$(jq -r .archiveBytes lab/management-workload-oci-archive-receipt.json)"
          mkdir -p /tmp/distribution/archive /tmp/distribution/manifests
          python3 scripts/prepare_appliance_distribution_parts.py --input "$archive" --out-dir /tmp/distribution/archive --name platform-workloads.oci.tar --manifest /tmp/distribution/manifests/archive.json
          jq -e '.partCount>=2 and .sizeBytes>0' /tmp/distribution/manifests/archive.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DIST_TAG" > /tmp/release-assets.json
          for asset in /tmp/distribution/archive/*; do
            name="$(basename "$asset")"
            size="$(stat -c %s "$asset")"
            digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
            if jq -e --arg name "$name" --arg digest "$digest" --argjson size "$size" '.assets[] | select(.name==$name and .size==$size and .digest==$digest)' /tmp/release-assets.json >/dev/null; then
              echo "release asset already exact; skip upload: $name"
            else
              gh release upload "$DIST_TAG" "$asset" --clobber
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DIST_TAG" > /tmp/release-assets.json
            fi
          done
          rm -rf /tmp/archive-artifact /tmp/distribution/archive
          df -h /

      - name: Download exact input-pack artifact
        if: env.PUBLIC_ASSETS_READY != 'true'
        uses: actions/download-artifact@v4
        with:
          name: appliance-input-pack
          path: /tmp/pack-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PACK_RUN_ID }}

      - name: Verify, split and publish input-pack parts
        if: env.PUBLIC_ASSETS_READY != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APPLIANCE_RELEASE_TOKEN != '' && secrets.APPLIANCE_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          pack="$(find /tmp/pack-artifact -type f -name appliance-input-pack.zip -print -quit)"
          test -f "$pack"
          test "$(sha256sum "$pack"|awk '{print "sha256:"$1}')" = "$(jq -r .inputPackSha256 lab/appliance-input-pack-receipt.json)"
          test "$(stat -c %s "$pack")" = "$(jq -r .inputPackBytes lab/appliance-input-pack-receipt.json)"
          mkdir -p /tmp/distribution/pack
          python3 scripts/prepare_appliance_distribution_parts.py --input "$pack" --out-dir /tmp/distribution/pack --name appliance-input-pack.zip --manifest /tmp/distribution/manifests/pack.json
          jq -e '.partCount>=2 and .sizeBytes>0' /tmp/distribution/manifests/pack.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DIST_TAG" > /tmp/release-assets.json
          for asset in /tmp/distribution/pack/*; do
            name="$(basename "$asset")"
            size="$(stat -c %s "$asset")"
            digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
            if jq -e --arg name "$name" --arg digest "$digest" --argjson size "$size" '.assets[] | select(.name==$name and .size==$size and .digest==$digest)' /tmp/release-assets.json >/dev/null; then
              echo "release asset already exact; skip upload: $name"
            else
              gh release upload "$DIST_TAG" "$asset" --clobber
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DIST_TAG" > /tmp/release-assets.json
            fi
          done
          rm -rf /tmp/distribution/pack
          echo "PACK_FILE=$pack" >> "$GITHUB_ENV"
          df -h /

      - name: Build public multipart authority manifest
        if: env.PUBLIC_ASSETS_READY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          repo=os.environ["GITHUB_REPOSITORY"]; tag=os.environ["DIST_TAG"]
          def convert(path):
              d=json.loads(Path(path).read_text())
              parts=[]
              for row in d["parts"]:
                  url=f"https://github.com/{repo}/releases/download/{tag}/{row['fileName']}"
                  parts.append({"index":row["index"],"urls":[url],"sha256":row["sha256"],"sizeBytes":row["sizeBytes"]})
              return {"sha256":"sha256:"+d["sha256"],"sizeBytes":d["sizeBytes"],"parts":parts}
          out={"authority":"APPLIANCE_MULTIPART_DISTRIBUTION_AUTHORITY_V1","archive":convert("/tmp/distribution/manifests/archive.json"),"inputPack":convert("/tmp/distribution/manifests/pack.json")}
          Path("/tmp/distribution/public-manifest.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY

      - name: Prove unauthenticated public streaming readback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          manifest=json.loads(Path("/tmp/distribution/public-manifest.json").read_text())

          def fetch_exact(part,key):
              last=""
              tmp=Path(f"/tmp/readback-{key}-{part['index']}")
              for attempt in range(1,7):
                  tmp.unlink(missing_ok=True)
                  request=urllib.request.Request(
                      part["urls"][0],
                      headers={"User-Agent":"4SO-Public-Distribution-Readback/2","Cache-Control":"no-cache"},
                  )
                  ph=hashlib.sha256(); ptotal=0
                  try:
                      with urllib.request.urlopen(request,timeout=180) as resp, tmp.open("wb") as out:
                          while True:
                              block=resp.read(4*1024*1024)
                              if not block: break
                              ph.update(block); ptotal+=len(block); out.write(block)
                      got=ph.hexdigest()
                      if got==part["sha256"] and ptotal==part["sizeBytes"]:
                          return tmp
                      last=f"digest={got} bytes={ptotal}"
                  except Exception as exc:
                      last=f"{type(exc).__name__}: {exc}"
                  tmp.unlink(missing_ok=True)
                  print(f"PUBLIC_READBACK_RETRY {key} part={part['index']} attempt={attempt} last={last}",flush=True)
                  time.sleep(min(5*attempt,20))
              raise SystemExit(f"{key}: part byte identity mismatch after bounded retry: {last}")

          pack_output=Path("/tmp/appliance-input-pack-public.zip")
          pack_output.unlink(missing_ok=True)
          for key in ("archive","inputPack"):
              obj=manifest[key]; whole=hashlib.sha256(); total=0
              dst=pack_output.open("wb") if key=="inputPack" else None
              try:
                  for expected_index,part in enumerate(obj["parts"]):
                      if part["index"]!=expected_index: raise SystemExit(f"{key}: part index drift")
                      tmp=fetch_exact(part,key)
                      with tmp.open("rb") as fh:
                          for block in iter(lambda:fh.read(4*1024*1024),b""):
                              whole.update(block); total+=len(block)
                              if dst is not None: dst.write(block)
                      tmp.unlink()
              finally:
                  if dst is not None: dst.close()
              if "sha256:"+whole.hexdigest()!=obj["sha256"] or total!=obj["sizeBytes"]:
                  raise SystemExit(f"{key}: full reconstruction identity mismatch")
              print(f"PUBLIC_READBACK_PASS {key} parts={len(obj['parts'])} bytes={total}")
          PY
          echo "PACK_FILE=/tmp/appliance-input-pack-public.zip" >> "$GITHUB_ENV"

      - name: Seal canonical S1 authority
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.status=="ready"' lab/appliance-bundle-acquisition-lock.json >/dev/null; then
            echo "S1 distribution already ready; validate without rewriting"
          else
            python3 scripts/seal_appliance_bundle_distribution.py --input-pack "$PACK_FILE" --distribution-manifest /tmp/distribution/public-manifest.json --write
          fi
          python3 scripts/supply_chain_handoff.py --write --plan lab/supply-chain-handoff-plan.json
          python3 scripts/supply_chain_handoff.py --check --plan lab/supply-chain-handoff-plan.json
          python3 scripts/validate_repository.py .
          python3 -m unittest tests.test_distribution_transport tests.test_appliance_bundle_distribution tests.test_final_exact_release_admission tests.test_supply_chain_handoff
          git diff --check

      - name: Persist exact multipart distribution authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4so-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo "main advanced; recomputing distribution authority on latest canonical main"
            git reset --hard origin/main
            if jq -e '.status=="ready"' lab/appliance-bundle-acquisition-lock.json >/dev/null; then
              python3 scripts/validate_repository.py .
            else
              python3 scripts/seal_appliance_bundle_distribution.py --input-pack "$PACK_FILE" --distribution-manifest /tmp/distribution/public-manifest.json --write
              python3 scripts/supply_chain_handoff.py --write --plan lab/supply-chain-handoff-plan.json
              python3 scripts/supply_chain_handoff.py --check --plan lab/supply-chain-handoff-plan.json
              python3 scripts/validate_repository.py .
            fi
          fi
          git add lab/appliance-bundle-acquisition-lock.json lab/supply-chain-handoff-plan.json
          git diff --cached --quiet && { echo "no distribution authority delta"; exit 0; }
          git commit -m "evidence: seal public multipart appliance distribution"
          git push origin HEAD:main
