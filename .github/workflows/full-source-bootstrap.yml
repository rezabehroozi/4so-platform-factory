name: full-source-bootstrap

on:
  push:
    branches: [main]
    paths: ['.bootstrap/READY']

permissions:
  contents: write
  actions: write

jobs:
  synchronize-exact-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and verify exact local Git bundle
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < .bootstrap/EXPECTED_HEAD)"
          expected_bundle_sha="$(tr -d '\r\n' < .bootstrap/BUNDLE_SHA256)"
          cat .bootstrap/chunks/* > /tmp/full.bundle.b64
          base64 -d /tmp/full.bundle.b64 > /tmp/full.bundle
          test "$(sha256sum /tmp/full.bundle | awk '{print $1}')" = "$expected_bundle_sha"
          git bundle verify /tmp/full.bundle
          git fetch /tmp/full.bundle main:refs/remotes/bootstrap/main
          test "$(git rev-parse refs/remotes/bootstrap/main)" = "$expected"
          test "$(git ls-tree -r --name-only refs/remotes/bootstrap/main | wc -l)" -eq 600
          git push --force origin "refs/remotes/bootstrap/main:refs/heads/main"
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote" = "$expected"
      - name: Dispatch clean-clone repository integrity verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/repository-integrity.yml/dispatches" \
            -d '{"ref":"main"}'
