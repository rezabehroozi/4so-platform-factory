name: mcp-external-interop-campaign

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-authority-notice:
    runs-on: ubuntu-latest
    steps:
      - name: C7W execution authority is local-only
        shell: bash
        run: |
          set -euo pipefail
          echo "This workflow is intentionally non-authoritative and performs no C7W execution."
          echo "Use the canonical local path:"
          echo "  C7W_MCP_ENDPOINT=https://<api>/mcp C7W_OAUTH_CLIENT_MAP=/secure/oauth-client-bindings.json make c7w-prepare"
          echo "Then execute the four real named-client packets locally and admit each capture with make c7w-admit."
