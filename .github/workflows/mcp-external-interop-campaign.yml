name: mcp-external-interop-campaign

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-authority-notice:
    runs-on: ubuntu-latest
    steps:
      - name: C7W execution authority is local-only
        shell: bash
        run: |
          set -euo pipefail
          echo "This workflow is intentionally non-authoritative and performs no C7W execution."
          echo "Start with the read-only local preflight on the canonical main checkout:"
          echo "  <python> scripts/c7w_preflight.py --root ."
          echo "Follow its machine-readable nextActionCode/nextCommand. It verifies source freeze, HTTPS MCP metadata/challenge, exact runtime source SHA and all four trusted-client bindings before campaign creation."
          echo "External clients must execute the exact packetPath and fill the returned captureTemplatePath at expectedCapturePath; never fabricate named-client evidence."
