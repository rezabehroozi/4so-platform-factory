name: mcp-external-interop-campaign

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-authority-notice:
    runs-on: ubuntu-latest
    steps:
      - name: C7W execution authority is local-only
        shell: bash
        run: |
          set -euo pipefail
          echo "This workflow is intentionally non-authoritative and performs no C7W execution."
          echo "Use the canonical local runner on the control host:"
          echo "  <python> scripts/run_mcp_external_interop.py --state-dir <state-dir> status"
          echo "Follow its machine-readable nextCommand. Provide C7W_MCP_ENDPOINT, C7W_OAUTH_CLIENT_MAP and C7W_PLATFORM_ADMIN_TOKEN only when requiredInputs requests them."
          echo "External clients must execute the exact packetPath and fill the returned captureTemplatePath at expectedCapturePath; never fabricate named-client evidence."
