name: closure-acquisition-once
# closure-wave: 2 — exact source/historical acquisition from green f7aabf6 base

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/closure-acquisition-once.yml

permissions:
  contents: write

jobs:
  acquire:
    if: contains(github.event.head_commit.message, '[closure-acquire]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PLATFORM_FACTORY_ACQUISITION_TOOL_DIR: /tmp/4so-acquisition-tools
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Bootstrap exact acquisition toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upstream_acquisition_toolchain.py --bootstrap "$PLATFORM_FACTORY_ACQUISITION_TOOL_DIR"
          python3 scripts/upstream_acquisition_toolchain.py --check
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/platformctl ./cmd/platformctl
          bin/platformctl version >/dev/null

      - name: Acquire S1 current sources and S2 reviewed predecessors
        id: source_acquisition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          : > /tmp/closure-acquisition-failures.txt

          ensure_ctl() {
            if [ ! -x bin/platformctl ]; then
              mkdir -p bin
              CGO_ENABLED=0 go build -trimpath -o bin/platformctl ./cmd/platformctl
            fi
          }

          checkpoint() {
            local label="$1"
            python3 scripts/supply_chain_handoff.py --write --plan lab/supply-chain-handoff-plan.json
            python3 scripts/validate_repository.py .
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "evidence: ${label}"
            fi
          }

          mapfile -t current < <(
            python3 scripts/acquire_upstream_batch.py --plan --json |
            python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)["ready"]))'
          )
          echo "S1 ready count: ${#current[@]}"
          for component in "${current[@]}"; do
            [ -n "$component" ] || continue
            ensure_ctl
            echo "::group::S1 $component"
            set +e
            python3 scripts/acquire_upstream_helm.py --from-admission --component "$component" --install
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              checkpoint "S1 exact current source $component"
            else
              echo "S1:$component:rc=$rc" | tee -a /tmp/closure-acquisition-failures.txt
              git reset --hard HEAD
              git clean -fd
            fi
            echo "::endgroup::"
          done

          plan=/tmp/historical-plan.json
          python3 scripts/acquire_historical_upgrade_batch.py --plan --json > "$plan"
          mapfile -t helm_hist < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("\n".join(d["helmHistoricalReady"]))' "$plan")
          mapfile -t tagged_hist < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("\n".join(d["taggedSourceSetHistoricalReady"]))' "$plan")
          echo "S2 helm ready: ${#helm_hist[@]} tagged ready: ${#tagged_hist[@]}"

          for component in "${helm_hist[@]}"; do
            [ -n "$component" ] || continue
            ensure_ctl
            echo "::group::S2 helm $component"
            set +e
            python3 scripts/acquire_upstream_helm.py --component "$component" --from-upgrade-admission --historical --install
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              checkpoint "S2 exact historical Helm source $component"
            else
              echo "S2-helm:$component:rc=$rc" | tee -a /tmp/closure-acquisition-failures.txt
              git reset --hard HEAD
              git clean -fd
            fi
            echo "::endgroup::"
          done

          for component in "${tagged_hist[@]}"; do
            [ -n "$component" ] || continue
            ensure_ctl
            echo "::group::S2 tagged $component"
            set +e
            python3 scripts/acquire_upstream_tagged_source.py --component "$component" --from-upgrade-admission --historical --install
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              checkpoint "S2 exact historical tagged source $component"
            else
              echo "S2-tagged:$component:rc=$rc" | tee -a /tmp/closure-acquisition-failures.txt
              git reset --hard HEAD
              git clean -fd
            fi
            echo "::endgroup::"
          done

          python3 scripts/supply_chain_handoff.py --write --plan lab/supply-chain-handoff-plan.json
          python3 scripts/validate_repository.py .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "evidence: refresh closure handoff after acquisition wave"
          fi

      - name: Push durable successful checkpoints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git push origin HEAD:main

      - name: Acquire exact OpenChoreo v1.3.0 source/chart/image evidence
        id: j8
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/4so-j8
          python3 scripts/acquire_openchoreo_runtime.py \
            --out /tmp/4so-j8/openchoreo-1.3.0-source.zip \
            > /tmp/4so-j8/acquisition-receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/4so-j8/acquisition-receipt.json")
          d=json.loads(p.read_text())
          Path("/tmp/4so-j8/SUMMARY.txt").write_text(
              f"authority={d['authority']}\nversion={d['version']}\n"
              f"upstreamCommit={d['upstreamCommit']}\nbundleSha256={d['bundleSha256']}\n"
              f"images={len(d['images'])}\nplanes={len(d['planes'])}\n"
          )
          PY

      - name: Upload J8 exact acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openchoreo-v1.3.0-exact-acquisition
          path: /tmp/4so-j8/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish acquisition summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Closure acquisition wave"
            echo
            echo "### Failed component acquisitions"
            if [ -s /tmp/closure-acquisition-failures.txt ]; then
              sed 's/^/- /' /tmp/closure-acquisition-failures.txt
            else
              echo "- None"
            fi
            echo
            echo "### Final source plan"
            python3 scripts/acquire_upstream_batch.py --plan
            echo
            echo "### Final historical plan"
            python3 scripts/acquire_historical_upgrade_batch.py --plan
            if [ -f /tmp/4so-j8/SUMMARY.txt ]; then
              echo
              echo "### J8 exact acquisition"
              sed 's/^/- /' /tmp/4so-j8/SUMMARY.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail honestly on unresolved acquisition execution errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/closure-acquisition-failures.txt ]; then
            cat /tmp/closure-acquisition-failures.txt >&2
            exit 1
          fi
          if [ ! -s /tmp/4so-j8/acquisition-receipt.json ]; then
            echo "J8 exact acquisition evidence missing" >&2
            exit 1
          fi
