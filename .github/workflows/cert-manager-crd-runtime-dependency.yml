name: cert-manager-crd-runtime-dependency
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cert-manager-crd-runtime-dependency.yml
      - catalog/runtime-dependencies/cert-manager/crd-runtime-dependency-lock.json
      - scripts/verify_cert_manager_crd_dependency.py
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact CRD lock
        run: python3 scripts/verify_cert_manager_crd_dependency.py
      - name: Acquire exact CRD bytes
        shell: bash
        run: |
          set -euo pipefail
          jq -c '.assets[]' catalog/runtime-dependencies/cert-manager/crd-runtime-dependency-lock.json | while read -r row; do
            rel="$(jq -r .path <<<"$row")"
            url="$(jq -r .url <<<"$row")"
            sha="$(jq -r .sha256 <<<"$row")"
            size="$(jq -r .sizeBytes <<<"$row")"
            mkdir -p "$(dirname "$rel")"
            curl -fL --retry 3 --connect-timeout 30 -o "$rel" "$url"
            test "$(sha256sum "$rel"|awk '{print $1}')" = "$sha"
            test "$(stat -c %s "$rel")" = "$size"
          done
          python3 scripts/verify_cert_manager_crd_dependency.py --require-bytes
      - name: Seal acquisition evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          lock=json.loads(Path("catalog/runtime-dependencies/cert-manager/crd-runtime-dependency-lock.json").read_text())
          rows=[]
          for r in lock["assets"]:
              p=Path(r["path"]); rows.append({"release":r["release"],"path":r["path"],"sha256":"sha256:"+hashlib.sha256(p.read_bytes()).hexdigest(),"sizeBytes":p.stat().st_size})
          out={"apiVersion":"platform.4so.io/v1alpha1","kind":"CertManagerCRDRuntimeDependencyEvidence","authority":"CERT_MANAGER_CRD_RUNTIME_DEPENDENCY_EVIDENCE_V1","sourceCommitSHA":os.environ["GITHUB_SHA"],"sourceRunId":os.environ["GITHUB_RUN_ID"],"assets":rows,"expectedCRDCount":6,"bytesVerified":True,"runtimeCertified":False,"physicalCertified":False}
          Path("lab/cert-manager-crd-runtime-dependency-evidence.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cert-manager-crd-runtime-dependency
          path: |
            catalog/runtime-dependencies/cert-manager/1.21.0/cert-manager.crds.yaml
            catalog/runtime-dependencies/cert-manager/1.21.1/cert-manager.crds.yaml
            lab/cert-manager-crd-runtime-dependency-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist exact CRD authority when main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4so-evidence-bot"; git config user.email "actions@users.noreply.github.com"
          git add catalog/runtime-dependencies/cert-manager/1.21.0/cert-manager.crds.yaml catalog/runtime-dependencies/cert-manager/1.21.1/cert-manager.crds.yaml lab/cert-manager-crd-runtime-dependency-evidence.json
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then echo "main advanced; skip stale cert-manager CRD persistence"; git reset; exit 0; fi
          git commit -m "evidence: acquire exact cert-manager CRDs"
          git push origin HEAD:main
