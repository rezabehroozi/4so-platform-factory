name: repository-export-0-0-220

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repository-export-0.0.220.yml']

permissions:
  contents: read

jobs:
  export-parent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact pre-checkpoint repository
        shell: bash
        run: |
          set -euo pipefail
          expected='ecc1251cbebb97272984775c716564d83121cefa'
          test "$(git rev-parse HEAD^)" = "$expected"
          git archive --format=tar.gz --output=/tmp/4so-platform-factory-0.0.220-git-tree.tar.gz "$expected"
          sha256sum /tmp/4so-platform-factory-0.0.220-git-tree.tar.gz | tee /tmp/4so-platform-factory-0.0.220-git-tree.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: repository-export-0.0.220
          path: |
            /tmp/4so-platform-factory-0.0.220-git-tree.tar.gz
            /tmp/4so-platform-factory-0.0.220-git-tree.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
