name: openchoreo-runtime-realism

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/openchoreo-runtime-realism.yml
      - runtime/openchoreo/**
      - scripts/acquire_openchoreo_runtime.py
      - scripts/mirror_openchoreo_runtime.py
      - scripts/prepare_openchoreo_executor.py
      - scripts/build_openchoreo_executor_image.py
      - scripts/seal_openchoreo_runtime.py
      - scripts/openchoreo_runtime_contract.py
      - deploy/images/Dockerfile.openchoreo-runtime-release
      - tests/test_openchoreo_buildkit_toolchain.py

permissions:
  contents: write
  actions: read

jobs:
  ephemeral-runtime-realism:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq curl unzip ca-certificates

      - name: Bootstrap exact Helm and crane toolchain
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/j8-tools /tmp/j8-toolchain-stage
          python3 scripts/upstream_acquisition_toolchain.py --bootstrap /tmp/j8-tools --timeout 180
          mkdir -p /tmp/j8-toolchain-stage
          python3 - <<'PY'
          import hashlib, json, urllib.request, urllib.parse
          from pathlib import Path
          doc=json.loads(Path("catalog/upstream-acquisition-toolchain.json").read_text())
          target="linux-amd64"
          stage=Path("/tmp/j8-toolchain-stage")
          for tool in doc["spec"]["tools"]:
              asset=tool["platforms"][target]
              url=asset["url"]
              name=Path(urllib.parse.urlsplit(url).path).name
              out=stage/name
              req=urllib.request.Request(url,headers={"User-Agent":"4so-openchoreo-runtime-realism/1"})
              with urllib.request.urlopen(req,timeout=180) as src, out.open("wb") as dst:
                  while True:
                      chunk=src.read(1024*1024)
                      if not chunk: break
                      dst.write(chunk)
              got=hashlib.sha256(out.read_bytes()).hexdigest()
              if got != asset["sha256"]:
                  raise SystemExit(f"TOOLCHAIN_DIGEST_MISMATCH {tool['name']} expected={asset['sha256']} actual={got}")
          PY
          echo "PLATFORM_FACTORY_ACQUISITION_TOOL_DIR=/tmp/j8-tools" >> "$GITHUB_ENV"

      - name: Download retained exact FULL release
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(jq -r '.sourceRunId' lab/management-workload-product-image-receipt.json)"
          test "$run_id" != "null" && test -n "$run_id"
          echo "PRODUCT_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Fetch retained release artifact
        uses: actions/download-artifact@v4
        with:
          name: management-product-image-evidence
          path: /tmp/j8-product-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PRODUCT_RUN_ID }}

      - name: Verify retained exact release
        shell: bash
        run: |
          set -euo pipefail
          release="$(find /tmp/j8-product-evidence -type f -name '4so-platform-factory-*.zip' -print -quit)"
          test -f "$release"
          expected="$(jq -r '.releaseArtifactDigest' lab/management-workload-product-image-receipt.json)"
          test "sha256:$(sha256sum "$release" | awk '{print $1}')" = "$expected"
          python3 scripts/verify_release.py "$release"
          echo "J8_EXACT_RELEASE=$release" >> "$GITHUB_ENV"

      - name: Acquire exact OpenChoreo v1.3 runtime source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/4so-j8
          mkdir -p /tmp/4so-j8
          python3 scripts/acquire_openchoreo_runtime.py             --network-timeout 180             --out /tmp/4so-j8/openchoreo-1.3.0-source.zip > /tmp/4so-j8/acquire-result.json
          jq -e '.authority == "OPENCHOREO_RUNTIME_ACQUISITION_AUTHORITY_V1" and .version == "1.3.0" and .sourceResolved == true and .imageBytesIncluded == false and .executionReady == false' /tmp/4so-j8/acquire-result.json >/dev/null
          test "$(jq '.images | length' /tmp/4so-j8/acquire-result.json)" -gt 0

      - name: Start exact ephemeral zot
        shell: bash
        run: |
          set -euo pipefail
          zot_ref="$(jq -r '.images[] | select(.role=="zot") | .exactReference' lab/management-workload-external-image-receipt.json)"
          test "$zot_ref" != "null" && test -n "$zot_ref"
          mkdir -p /tmp/4so-j8/zot-data
          cat > /tmp/4so-j8/zot-config.json <<'JSON'
          {
            "distSpecVersion": "1.1.0",
            "storage": {"rootDirectory": "/var/lib/registry", "commit": true, "dedupe": true, "gc": true},
            "http": {"address": "0.0.0.0", "port": "5000", "compat": ["docker2s2"]},
            "log": {"level": "info"},
            "extensions": {"ui": {"enable": false}}
          }
          JSON
          docker run -d --name 4so-j8-zot             -p 5000:5000             -v /tmp/4so-j8/zot-config.json:/etc/zot/config.json:ro             -v /tmp/4so-j8/zot-data:/var/lib/registry             "$zot_ref" serve /etc/zot/config.json
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/v2/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs 4so-j8-zot
          exit 41

      - name: Mirror exact OpenChoreo runtime images into ephemeral zot
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/mirror_openchoreo_runtime.py             --acquisition /tmp/4so-j8/openchoreo-1.3.0-source.zip             --zot-repository-prefix 127.0.0.1:5000/4so/openchoreo             --out /tmp/4so-j8/mirror-evidence.json > /tmp/4so-j8/mirror-result.json
          jq -e '.authority == "OPENCHOREO_ZOT_MIRROR_EVIDENCE_V1" and .registryAuthority == "zot" and .mirrorReady == true' /tmp/4so-j8/mirror-evidence.json >/dev/null
          test "$(jq '.images | length' /tmp/4so-j8/mirror-evidence.json)" = "$(jq '.images | length' /tmp/4so-j8/acquire-result.json)"

      - name: Prepare exact offline executor context
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_openchoreo_executor.py             --release "$J8_EXACT_RELEASE"             --acquisition /tmp/4so-j8/openchoreo-1.3.0-source.zip             --toolchain-stage /tmp/j8-toolchain-stage             --out /tmp/4so-j8/executor-context > /tmp/4so-j8/context-result.json
          jq -e '.authority == "OPENCHOREO_EXECUTOR_CONTEXT_AUTHORITY_V1" and .build.authority == "buildkit" and .build.networkRequired == false and .build.baseImageRequired == false' /tmp/4so-j8/context-result.json >/dev/null

      - name: Install exact BuildKit v0.33.0
        shell: bash
        run: |
          set -euo pipefail
          url="$(jq -r '.spec.asset.url' runtime/openchoreo/buildkit-toolchain.json)"
          expected="$(jq -r '.spec.asset.sha256' runtime/openchoreo/buildkit-toolchain.json)"
          expected_size="$(jq -r '.spec.asset.sizeBytes' runtime/openchoreo/buildkit-toolchain.json)"
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/4so-j8/buildkit.tar.gz "$url"
          test "$(stat -c %s /tmp/4so-j8/buildkit.tar.gz)" = "$expected_size"
          test "$(sha256sum /tmp/4so-j8/buildkit.tar.gz | awk '{print $1}')" = "$expected"
          mkdir -p /tmp/4so-j8/buildkit
          tar -C /tmp/4so-j8/buildkit -xzf /tmp/4so-j8/buildkit.tar.gz
          test "$(/tmp/4so-j8/buildkit/bin/buildctl --version | awk '{print $3}')" = "v0.33.0"
          test "$(/tmp/4so-j8/buildkit/bin/buildkitd --version | awk '{print $3}')" = "v0.33.0"

      - name: Start BuildKit for plain-http ephemeral zot
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/4so-j8/buildkitd.toml <<'TOML'
          [registry."127.0.0.1:5000"]
            http = true
            insecure = true
          TOML
          sudo nohup /tmp/4so-j8/buildkit/bin/buildkitd             --addr unix:///tmp/4so-j8/buildkitd.sock             --config /tmp/4so-j8/buildkitd.toml             >/tmp/4so-j8/buildkitd.log 2>&1 &
          for i in $(seq 1 60); do
            if test -S /tmp/4so-j8/buildkitd.sock; then
              sudo chmod 0666 /tmp/4so-j8/buildkitd.sock
              /tmp/4so-j8/buildkit/bin/buildctl --addr unix:///tmp/4so-j8/buildkitd.sock debug workers
              exit 0
            fi
            sleep 1
          done
          cat /tmp/4so-j8/buildkitd.log
          exit 42

      - name: Build and registry-readback exact executor image
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_openchoreo_executor_image.py             --context /tmp/4so-j8/executor-context             --buildctl /tmp/4so-j8/buildkit/bin/buildctl             --buildkit-address unix:///tmp/4so-j8/buildkitd.sock             --zot-repository 127.0.0.1:5000/4so/openchoreo/openchoreo-runtime             --out /tmp/4so-j8/executor-evidence.json > /tmp/4so-j8/executor-result.json
          jq -e '.authority == "OPENCHOREO_EXECUTOR_IMAGE_EVIDENCE_V1" and .buildAuthority == "buildkit" and .registryAuthority == "zot" and .registryReadback == true and .mirrorReady == true' /tmp/4so-j8/executor-evidence.json >/dev/null

      - name: Seal and read back ephemeral runtime authority
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/seal_openchoreo_runtime.py             --acquisition /tmp/4so-j8/openchoreo-1.3.0-source.zip             --mirror-evidence /tmp/4so-j8/mirror-evidence.json             --executor-evidence /tmp/4so-j8/executor-evidence.json             --out /tmp/4so-j8/runtime-source.json > /tmp/4so-j8/seal-result.json
          jq -e '.authority == "OPENCHOREO_RUNTIME_SOURCE_AUTHORITY_V1" and .version == "1.3.0" and .resolved == true and .mirrorReady == true and .buildAuthority == "buildkit" and .registryAuthority == "zot"' /tmp/4so-j8/runtime-source.json >/dev/null
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path("/tmp/4so-j8/runtime-source.json")
          runtime=json.loads(p.read_text())
          evidence={
            "apiVersion":"platform.4so.io/v1alpha1",
            "kind":"OpenChoreoRuntimeRealismEvidence",
            "authority":"OPENCHOREO_RUNTIME_REALISM_EVIDENCE_V1",
            "sourceRunId":os.environ["GITHUB_RUN_ID"],
            "sourceCommitSHA":os.environ["GITHUB_SHA"],
            "runtimeSourceSha256":"sha256:"+hashlib.sha256(p.read_bytes()).hexdigest(),
            "version":runtime["version"],
            "upstreamCommit":runtime["upstreamCommit"],
            "imageCount":len(runtime["images"]),
            "registryMode":"ephemeral-local-zot",
            "buildAuthority":"buildkit",
            "runtimeRealismPass":True,
            "productionSourceSealed":False,
            "runtimeCertified":False,
            "physicalCertified":False
          }
          Path("/tmp/4so-j8/runtime-realism-receipt.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          Path("lab/openchoreo-runtime-realism-receipt.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          PY
          jq -e '.runtimeRealismPass == true and .productionSourceSealed == false and .runtimeCertified == false and .physicalCertified == false and .registryMode == "ephemeral-local-zot"' lab/openchoreo-runtime-realism-receipt.json >/dev/null

      - name: Upload J8 runtime-realism evidence
        uses: actions/upload-artifact@v4
        with:
          name: openchoreo-runtime-realism
          path: |
            /tmp/4so-j8/openchoreo-1.3.0-source.zip
            /tmp/4so-j8/mirror-evidence.json
            /tmp/4so-j8/executor-evidence.json
            /tmp/4so-j8/runtime-source.json
            /tmp/4so-j8/runtime-realism-receipt.json
            lab/openchoreo-runtime-realism-receipt.json
            /tmp/4so-j8/buildkitd.log
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Commit Git-safe J8 runtime-realism receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4so-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/openchoreo-runtime-realism-receipt.json
          git diff --cached --quiet && { echo "no J8 runtime-realism receipt delta"; exit 1; }
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo "main advanced; refusing concurrent writer"; exit 2; }
          git commit -m "evidence: seal OpenChoreo runtime realism"
          git push origin HEAD:main
