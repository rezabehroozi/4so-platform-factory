name: victoria-metrics-render-drift-diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/victoria-metrics-render-drift-diagnostic.yml
      - scripts/diagnose_exact_helm_render_drift.py
      - catalog/runtime/victoria-metrics/0.90.1/**
      - catalog/runtime/victoria-metrics/0.90.2/**
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        release: ["0.90.1","0.90.2"]
        kubernetes: ["1.34.0","1.35.0"]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose exact repeated render
        run: |
          python3 scripts/diagnose_exact_helm_render_drift.py --component victoria-metrics --release "${{ matrix.release }}" --kube-version "${{ matrix.kubernetes }}" --out "/tmp/vm-${{ matrix.release }}-${{ matrix.kubernetes }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: victoria-render-drift-${{ matrix.release }}-${{ matrix.kubernetes }}
          path: /tmp/vm-${{ matrix.release }}-${{ matrix.kubernetes }}.json
          retention-days: 7
