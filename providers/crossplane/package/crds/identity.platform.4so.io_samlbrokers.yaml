apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: samlbrokers.identity.platform.4so.io
spec:
  group: identity.platform.4so.io
  scope: Namespaced
  names:
    plural: samlbrokers
    singular: samlbroker
    kind: SAMLBroker
    listKind: SAMLBrokerList
    categories:
      - crossplane
      - managed
      - 4so
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: READY
          type: string
          jsonPath: ".status.conditions[?(@.type=='Ready')].status"
        - name: SYNCED
          type: string
          jsonPath: ".status.conditions[?(@.type=='Synced')].status"
        - name: EXTERNAL-NAME
          type: string
          jsonPath: '.metadata.annotations.crossplane\.io/external-name'
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - forProvider
              properties:
                providerConfigRef:
                  type: object
                  default:
                    kind: ProviderConfig
                    name: default
                  required:
                    - kind
                    - name
                  properties:
                    kind:
                      type: string
                      minLength: 1
                    name:
                      type: string
                      minLength: 1
                managementPolicies:
                  type: array
                  default:
                    - "*"
                  items:
                    type: string
                    minLength: 1
                writeConnectionSecretToRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                forProvider:
                  type: object
                  required:
                    - organizationId
                    - alias
                    - displayName
                    - entityId
                    - singleSignOnServiceUrl
                    - signingCertificate
                    - wantAuthnRequestsSigned
                    - enabled
                  properties:
                    organizationId:
                      type: string
                      minLength: 1
                    alias:
                      type: string
                      minLength: 1
                    displayName:
                      type: string
                      minLength: 1
                    entityId:
                      type: string
                      minLength: 1
                    singleSignOnServiceUrl:
                      type: string
                      minLength: 1
                    singleLogoutServiceUrl:
                      type: string
                    signingCertificate:
                      type: string
                      minLength: 1
                    nameIdPolicyFormat:
                      type: string
                    wantAuthnRequestsSigned:
                      type: boolean
                    enabled:
                      type: boolean
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
