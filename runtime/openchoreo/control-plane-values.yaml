# 4SO optional target profile: OpenChoreo API/controllers only.
# Operator Horizon, 4SO MCP and Keycloak remain product authorities.
backstage:
  enabled: false
openchoreoApi:
  config:
    mcp:
      enabled: false
  metrics:
    serviceMonitor:
      enabled: false
controllerManager:
  metrics:
    serviceMonitor:
      enabled: false

# 4SO uses the target's existing ingress/service boundary; do not install kgateway/Gateway resources.
gateway:
  enabled: false
