# 4SO optional target profile. OpenChoreo v1.3.0 data-plane schema does
# not expose kube-prometheus-stack as a top-level value; monitoring ownership
# remains with the target capability resolver and only supported knobs live here.
clusterAgent:
  metrics:
    serviceMonitor:
      enabled: false

# Keep the OpenChoreo data plane internal; distribution/target ingress remains authoritative.
gateway:
  enabled: false
  tls:
    hostname: "*.apps.render.4so.test"
