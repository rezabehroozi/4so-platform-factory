# Deterministic source-acquisition render profile for the exact Loki chart.
# This proves chart/render/image supply-chain material only; it is NOT the
# production runtime storage policy and does not imply runtime certification.
deploymentMode: SingleBinary
loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
  useTestSchema: true
singleBinary:
  replicas: 1
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
minio:
  enabled: false
